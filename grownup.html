<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test me at home — Grown-up’s page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--aa:#1B3A6B;--honey:#F5B700;--honey2:#FFD54A;--honeyL:#FFF3C4;--ink:#1F2A44;--ink2:#46506B;--bg:#FFFBEF;--line:#F1E7C8;--ok:#1E9E5A;--okL:#E3F6EA;--bad:#D64545;--badL:#FDE8E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
header{background:var(--aa);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header .t{font-family:Fredoka;font-size:22px}header .s{font-size:13px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:20px}
.card{background:#fff;border:3px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px}
.muted{color:var(--ink2)}.small{font-size:14px}
button{font-family:Fredoka;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:var(--honey);color:var(--ink)}
button.w{background:#fff;border:2px solid var(--line)}
input{font:inherit;font-weight:700;padding:12px 14px;border:3px solid var(--line);border-radius:14px;width:100%;text-transform:uppercase;letter-spacing:.1em;text-align:center}
.words{display:grid;gap:10px;margin-top:14px}
.w1{display:flex;align-items:center;gap:14px;background:var(--honeyL);border:2px solid var(--honey2);border-radius:18px;padding:12px 16px}
.w1 .n{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:20px;flex:none}
.w1 .wd{font-family:Fredoka;font-size:32px;letter-spacing:.04em;flex:1}
.w1.ok{background:var(--okL);border-color:#A7E3BF}.w1.bad{background:#fff;border-color:#F5C2C2}
.typed{font-size:15px;color:var(--ink2)}.typed s{color:var(--bad);font-weight:800}
.steps{line-height:1.7;padding-left:22px;margin:8px 0 0}
.big{font-family:Fredoka;font-size:48px;text-align:center}
footer{text-align:center;color:var(--ink2);font-size:13px;padding:10px 0 30px}
</style>
</head>
<body>
<header><div style="font-size:34px">🐝</div><div><div class="t">Spelling Bee</div><div class="s" id="sch">Grown-up’s page</div></div></header>
<main id="app"><div class="card muted">Loading…</div></main>
<footer>Powered by ThinkNest</footer>
<script>
(function(){"use strict";
const SUPABASE_URL='https://xpbkdnkfufkahaszfycd.supabase.co',SUPABASE_KEY='sb_publishable_QIAV_9tLUBbDCu7FHqaTEw_zYQ0teEG';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}})}catch(e){}
const q=new URLSearchParams(location.search);let CODE=(q.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');let D=null,timer=null;
function speak(t){try{const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;s.speak(u)}catch(e){}}
async function load(){if(!sb){$('#app').innerHTML='<div class="card">Can’t connect. Please check the internet.</div>';return}
 if(!CODE){askCode();return}
 const {data,error}=await sb.rpc('sb_home_grownup',{p_code:CODE});
 if(error||!data||data.error){askCode('We couldn’t find that bee code. Please check it and try again.');return}
 D=data;render();clearTimeout(timer);if(D.state==='none'||D.state==='chosen'||D.state==='locked')timer=setTimeout(load,15000)}
function askCode(msg){$('#app').innerHTML=`<div class="card"><h2 style="font-size:26px">Test me at home</h2><p>Type your child’s <b>bee code</b> to see their spelling words.</p>${msg?`<p style="color:var(--bad);font-weight:800">${esc(msg)}</p>`:''}<input id="code" maxlength="8" placeholder="ABC-123" value="${esc(CODE)}"><div style="text-align:center;margin-top:12px"><button id="go">Show the words →</button></div></div>`;
 $('#go').onclick=()=>{CODE=$('#code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');history.replaceState(null,'','?c='+CODE);load()};$('#code').onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}
function render(){const n=esc(D.name);if(D.school)$('#sch').textContent=D.school+' · Grown-up’s page';
 const intro=`<div class="card"><h2 style="font-size:28px">🔒 Test me at home</h2><p style="margin-bottom:0">This week <b>${n}</b> chose 5 spelling words, looked at them carefully and then locked them. Now it’s your turn to test ${n}!</p></div>`;
 if(D.state==='none')return $('#app').innerHTML=intro+`<div class="card"><p class="f" style="font-size:22px">⏳ ${n} hasn’t chosen this week’s words yet.</p><p class="muted">On the Spelling Bee, ${n} opens <b>Family challenge</b> and chooses 5 words. This page updates by itself.</p><button class="w" id="rf">↻ Check again</button></div>`,bindRf();
 if(D.state==='chosen')return $('#app').innerHTML=intro+`<div class="card"><p class="f" style="font-size:22px">👀 ${n} is looking at the words now.</p><p class="muted">The words will appear here as soon as ${n} taps <b>“I’m ready — lock my words”</b>. This page updates by itself.</p><button class="w" id="rf">↻ Check again</button></div>`,bindRf();
 if(D.state==='locked'){$('#app').innerHTML=intro+`<div class="card"><h3 style="font-size:22px">How to test</h3><ol class="steps"><li>Ask ${n} to tap <b>“Start my test”</b> on the Spelling Bee.</li><li>For each word: <b>say the word</b>, use it in a <b>sentence</b>, then say the word <b>again</b>.</li><li>${n} writes the word and taps <b>Next</b>. Go in order, from word 1 to word 5.</li><li>Please don’t spell the word or show the screen — let ${n} try!</li></ol></div>
  <div class="card"><h3 style="font-size:22px">${n}’s 5 words</h3><p class="muted small" style="margin:4px 0 0">Not sure how to say a word? Tap 🔊.</p><div class="words">${(D.words||[]).map((w,i)=>`<div class="w1"><div class="n">${i+1}</div><div class="wd">${esc(w)}</div><button class="w" data-say="${esc(w)}">🔊</button></div>`).join('')}</div>
  <p class="muted small" style="margin-top:14px">When ${n} finishes, the results will appear here.</p><button class="w" id="rf">↻ Check for results</button></div>`;bindRf();bindSay();return}
 const A=D.answers||{};const ws=Object.keys(A);const right=ws.filter(w=>String(A[w]).trim().toLowerCase()===w.toLowerCase());
 $('#app').innerHTML=intro+`<div class="card"><h3 style="font-size:22px">✅ Test finished!</h3><div class="big">${D.score} / ${D.total}</div>
  <div class="words">${ws.map((w,i)=>{const ok=right.includes(w);return `<div class="w1 ${ok?'ok':'bad'}"><div class="n">${ok?'✅':'✏️'}</div><div style="flex:1"><div class="wd">${esc(w)}</div>${ok?'':`<div class="typed">${n} wrote: <s>${esc(A[w]||'—')}</s></div>`}</div><button class="w" data-say="${esc(w)}">🔊</button></div>`}).join('')}</div>
  <p style="margin-top:14px">${right.length===ws.length?`🌟 All 5 right — please give ${n} a big well done!`:`The words are now unlocked for ${n}. Encourage ${n} to tap <b>“Practise my mistakes”</b>, and praise the words they got right.`}</p>
  <p class="muted small">A new Test me at home challenge starts every Monday.</p></div>`;bindSay()}
function bindRf(){const b=$('#rf');if(b)b.onclick=()=>{b.disabled=true;load()}}
function bindSay(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say))}
load();
})();
</script>
</body>
</html>
