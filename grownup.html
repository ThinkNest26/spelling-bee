<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spelling Bee — Grown-up’s page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--aa:#1B3A6B;--honey:#F5B700;--honey2:#FFD54A;--honeyL:#FFF3C4;--ink:#1F2A44;--ink2:#46506B;--bg:#FFFBEF;--line:#F1E7C8;--ok:#1E9E5A;--okL:#E3F6EA;--bad:#D64545;--badL:#FDE8E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
header{background:var(--aa);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
header .t{font-family:Fredoka;font-size:22px}header .s{font-size:13px;opacity:.8}
main{max-width:760px;margin:0 auto;padding:20px}
.card{background:#fff;border:3px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
.muted{color:var(--ink2)}.small{font-size:14px}
button{font-family:Fredoka;font-weight:600;font-size:17px;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:var(--honey);color:var(--ink)}
button.w{background:#fff;border:2px solid var(--line)}
.hello{display:flex;align-items:center;gap:14px}.hello .av{font-size:54px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.st{background:var(--honeyL);border-radius:16px;padding:12px;text-align:center}.st b{display:block;font-family:Fredoka;font-size:30px}.st span{font-size:13px;font-weight:800;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{font-family:Fredoka;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 12px;cursor:pointer}
.words{display:grid;gap:10px;margin-top:12px}
.w1{display:flex;align-items:center;gap:14px;background:var(--honeyL);border:2px solid var(--honey2);border-radius:18px;padding:10px 14px}
.w1 .n{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:19px;flex:none}
.w1 .wd{font-family:Fredoka;font-size:30px;letter-spacing:.03em;flex:1;overflow-wrap:anywhere}
.w1.ok{background:var(--okL);border-color:#A7E3BF}.w1.bad{background:#fff;border-color:#F5C2C2}
.typed{font-size:15px;color:var(--ink2)}.typed s{color:var(--bad);font-weight:800}
.steps{line-height:1.7;padding-left:22px;margin:8px 0 0}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:8px;border-bottom:1px solid #F4EEDC;text-align:left}th{font-size:12px;text-transform:uppercase;color:var(--ink2)}
.tip{background:#EEF6FF;border-radius:16px;padding:12px 14px;margin-top:10px}
footer{text-align:center;color:var(--ink2);font-size:13px;padding:10px 0 30px}
</style>
</head>
<body>
<header><div style="font-size:34px">🐝</div><div><div class="t">Spelling Bee</div><div class="s" id="sch">Grown-up’s page</div></div></header>
<main id="app"><div class="card muted">Loading…</div></main>
<footer>This is a private page for your child’s grown-ups. Please don’t share the link. · Powered by ThinkNest</footer>
<script>
(function(){"use strict";
const SUPABASE_URL='https://xpbkdnkfufkahaszfycd.supabase.co',SUPABASE_KEY='sb_publishable_QIAV_9tLUBbDCu7FHqaTEw_zYQ0teEG';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}})}catch(e){}
const q=new URLSearchParams(location.search);const TOKEN=(q.get('p')||'').replace(/[^a-z0-9]/gi,'');let D=null,timer=null;
const GL=g=>+g===0?'KG2':'Grade '+g;
function speak(t){try{const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;s.speak(u)}catch(e){}}
function msg(h,t){$('#app').innerHTML=`<div class="card"><h2 style="font-size:24px">${h}</h2><p>${t}</p></div>`}
async function load(){if(!sb){msg('Can’t connect','Please check the internet and try again.');return}
 if(!TOKEN){msg('🔒 This page needs a private link',q.get('c')?'This link has changed. Ask your child to open <b>Family challenge</b> on the Spelling Bee and tap <b>“📤 Send to a grown-up”</b> for your new private link.':'Ask your child to open <b>Family challenge</b> on the Spelling Bee and tap <b>“📤 Send to a grown-up”</b>, or use the link on your child’s printed progress report.');return}
 const {data,error}=await sb.rpc('sb_parent_view',{p_token:TOKEN});
 if(error||!data||data.error){msg('🔒 Link not found','Please check you copied the whole link. If it still doesn’t work, ask your child to tap <b>“📤 Send to a grown-up”</b> again.');return}
 D=data;render();clearTimeout(timer);if(['chosen','locked'].includes(D.home&&D.home.state))timer=setTimeout(load,20000)}
function fd(d){return new Date(String(d).slice(0,10)+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function streakNow(){if(!D.streak_day)return 0;const td=new Date(Date.now()+4*3600e3).toISOString().slice(0,10);const y=new Date(Date.now()+4*3600e3-864e5).toISOString().slice(0,10);const fri=new Date(Date.now()+4*3600e3-3*864e5).toISOString().slice(0,10);return D.streak_day>=fri?D.streak:0}
function homeCard(){const n=esc(D.name),h=D.home||{state:'none'};
 const head=`<h2 style="font-size:24px">🔒 Test me at home <span class="small muted">(this week)</span></h2>`;
 if(h.state==='none')return `<div class="card">${head}<p>${n} hasn’t chosen this week’s 5 words yet. On the Spelling Bee, ${n} opens <b>Family challenge</b>, chooses 5 words, looks at them and locks them. Then the words appear here for you to test.</p></div>`;
 if(h.state==='chosen')return `<div class="card">${head}<p>👀 ${n} is looking at the 5 words now. They’ll appear here as soon as ${n} locks them. This page updates by itself.</p><button class="w" data-rf="1">↻ Check again</button></div>`;
 if(h.state==='locked')return `<div class="card">${head}<ol class="steps"><li>Ask ${n} to tap <b>“Start my test”</b> on the Spelling Bee.</li><li>For each word: <b>say the word</b>, use it in a <b>sentence</b>, then say it <b>again</b>.</li><li>${n} writes the word and taps <b>Next</b>. Go in order, from word 1 to word 5.</li><li>Please don’t spell the word or show this screen — let ${n} try!</li></ol>
  <div class="words">${(h.words||[]).map((w,i)=>`<div class="w1"><div class="n">${i+1}</div><div class="wd">${esc(w)}</div><button class="w" data-say="${esc(w)}">🔊</button></div>`).join('')}</div><p class="small muted">Not sure how to say a word? Tap 🔊. Results appear here when ${n} finishes.</p><button class="w" data-rf="1">↻ Check for results</button></div>`;
 const A=h.answers||{},ws=Object.keys(A),right=ws.filter(w=>String(A[w]).trim().toLowerCase()===w.toLowerCase());
 return `<div class="card">${head}<p class="f" style="font-size:22px;margin:8px 0">✅ ${n} got ${h.score} out of ${h.total}!</p><div class="words">${ws.map(w=>{const ok=right.includes(w);return `<div class="w1 ${ok?'ok':'bad'}"><div class="n">${ok?'✅':'✏️'}</div><div style="flex:1"><div class="wd">${esc(w)}</div>${ok?'':`<div class="typed">${n} wrote: <s>${esc(A[w]||'—')}</s></div>`}</div><button class="w" data-say="${esc(w)}">🔊</button></div>`}).join('')}</div>
  <p>${right.length===ws.length?`🌟 All 5 right — please give ${n} a big well done!`:`Praise the words ${n} got right, then practise the others together. They’ll also come back in ${n}’s tricky words on the Spelling Bee.`}</p></div>`}
function render(){const n=esc(D.name);if(D.school)$('#sch').textContent=D.school+' · Grown-up’s page';
 const st=streakNow();const acc=D.attempts?Math.round(D.correct/D.attempts*100):null;
 const practise=[...new Set([...(D.review&&D.review.words||[]),...(D.tricky||[])])].slice(0,12);
 const wk=(D.weekly||[]).filter(w=>w.pre||w.post);
 $('#app').innerHTML=`<div class="card"><div class="hello"><div class="av">🐝</div><div><h1 style="font-size:28px">${n}’s spelling</h1><div class="muted">${esc(D.class||GL(D.grade))}</div></div></div>
  <div class="stats"><div class="st"><b>${D.stars}</b><span>⭐ stars</span></div><div class="st"><b>${D.secure}</b><span>🔵 words learnt</span></div><div class="st"><b>${st||0}</b><span>🔥 day streak</span></div>${acc!==null?`<div class="st"><b>${acc}%</b><span>✅ spelt right</span></div>`:''}<div class="st"><b>${D.review?D.review.mastered:0}</b><span>🎓 tricky words mastered</span></div></div></div>
 ${homeCard()}
 <div class="card"><h2 style="font-size:24px">📝 Words to practise together</h2>${practise.length?`<p class="muted small" style="margin:6px 0 0">These are the words ${n} finds tricky right now. Tap a word to hear it.</p><div class="chips">${practise.map(w=>`<span class="chip" data-say="${esc(w)}">🔊 ${esc(w)}</span>`).join('')}</div>`:`<p>No tricky words right now — well done, ${n}! 🌟</p>`}
  <div class="tip">💡 <b>Try this:</b> say the word, ask ${n} to spell it out loud letter by letter, then say it again — just like in the real Spelling Bee.</div></div>
 ${wk.length?`<div class="card"><h2 style="font-size:24px">🗓 Weekly words</h2><table><thead><tr><th>Week</th><th>Monday test</th><th>Friday test</th></tr></thead><tbody>${wk.map(w=>`<tr><td><b>${esc(w.title)}</b></td><td>${w.pre?`${w.pre.score}/${w.pre.total}`:'—'}</td><td>${w.post?`${w.post.score}/${w.post.total}${w.post.challenge?' 🚀':''}`:`<span class="muted small">opens ${fd(w.post_from)}</span>`}</td></tr>`).join('')}</tbody></table><p class="small muted">🚀 means ${n} knew every word on Monday and was given challenge words.</p></div>`:''}
 ${D.gl&&D.gl.length?`<div class="card"><h2 style="font-size:24px">📋 GL practice tests</h2><table><thead><tr><th>Test</th><th>Score</th><th>Date</th></tr></thead><tbody>${D.gl.map(g=>`<tr><td>Test ${esc(g.form)}</td><td><b>${g.score}/${g.total}</b> (${Math.round(g.score/g.total*100)}%)</td><td>${fd(g.at)}</td></tr>`).join('')}</tbody></table><p class="small muted">Practice tests for spelling, grammar, punctuation and reading. Not affiliated with GL Assessment.</p></div>`:''}
 <div class="card"><h2 style="font-size:24px">🏠 How you can help</h2><ul class="steps"><li>Practise for <b>10 minutes a day</b> — little and often works best.</li><li>Do <b>Test me at home</b> together each week.</li><li>Celebrate effort, not just correct answers. 💛</li></ul>${D.slug?`<p><a href="./?s=${encodeURIComponent(D.slug)}">Open the ${esc(D.school)} Spelling Bee →</a></p>`:''}</div>`;
 document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{b.disabled=true;load()})}
load();
})();
</script>
</body>
</html>
