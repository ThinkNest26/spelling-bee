<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spelling Bee – Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="avatar.js"></script>
<style>
:root{--aa:#1B3A6B;--honey:#F5B700;--honey2:#FFD54A;--honeyL:#FFF3C4;--ink:#1F2A44;--ink2:#46506B;--muted:#6B7280;--bg:#FFFBEF;--line:#EFE6CC;--ok:#1E9E5A;--okL:#E3F6EA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font-family:inherit;font-weight:800;font-size:14px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--aa);color:#fff}
button.y{background:var(--honey);color:var(--ink)}button.w{background:#fff;color:var(--ink);border:1.5px solid var(--line)}button.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
label{font-size:12.5px;font-weight:800;color:var(--ink2);display:block;margin:10px 0 4px}
header{background:var(--aa);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .t{font-family:Fredoka;font-size:21px}header .s{font-size:12.5px;opacity:.75}header .right{margin-left:auto}header a{color:#fff;font-weight:800}
main{max-width:1250px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.muted{color:var(--muted)}.small{font-size:12.5px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}@media(max-width:980px){.layout{grid-template-columns:1fr}}
.types{display:grid;grid-template-columns:1fr 1fr;gap:6px}.types button{background:#fff;color:var(--ink);border:2px solid var(--line);text-align:left;font-size:13px;padding:8px 10px}.types button.on{border-color:var(--honey);background:var(--honeyL)}
.kids{max-height:330px;overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:6px}
.kids label{display:flex;align-items:center;gap:8px;margin:0;padding:5px 8px;border-radius:9px;font-size:14px;color:var(--ink);cursor:pointer}.kids label:hover{background:var(--honeyL)}.kids input{width:auto}.kids svg{border-radius:50%;flex:none}
.earned{margin-left:auto;font-size:11.5px;font-weight:800;background:var(--okL);color:#166534;border-radius:99px;padding:2px 8px}
.swatches{display:flex;gap:8px}.swatch{width:38px;height:38px;border-radius:50%;border:5px solid;padding:0}.swatch.on{outline:3px solid var(--ink);outline-offset:2px}
.layout>div{min-width:0}.preview{width:100%;background:#E9E3D2;border-radius:16px;padding:16px;overflow:auto}
.logobox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.logobox img{max-height:44px;max-width:140px;background:#fff;border-radius:6px;padding:3px;border:1px solid var(--line)}
/* certificate (A4 landscape, drawn at 297×210 units) */
.cert{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;font-family:Nunito,sans-serif;color:var(--cink);break-after:page;page-break-after:always}
.cert:last-child{break-after:auto;page-break-after:auto}
.cert .frame{position:absolute;inset:7mm;border:3mm solid var(--c1);border-radius:6mm}
.cert .frame2{position:absolute;inset:12mm;border:1mm dashed var(--c2);border-radius:4mm}
.cert .combs{position:absolute;width:80mm;height:80mm;opacity:.5}
.cert .tl{top:0;left:0}.cert .br{bottom:0;right:0;transform:rotate(180deg)}
.cert .inner{position:absolute;inset:18mm 22mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .logo{height:18mm;display:flex;align-items:center;justify-content:center}.cert .logo img{max-height:18mm;max-width:60mm;object-fit:contain}
.cert .kicker{font-family:Fredoka;font-size:9mm;letter-spacing:.06em;color:var(--c1);text-transform:uppercase;margin-top:2mm}
.cert .ttl{font-family:Fredoka;font-size:16mm;line-height:1.05;margin-top:1mm;color:var(--cink)}
.cert .pres{font-size:5.2mm;margin-top:4mm;color:#555}
.cert .who{display:flex;align-items:center;gap:6mm;margin-top:3mm}
.cert .who svg{border-radius:50%;border:1.5mm solid var(--c2);background:#fff}
.cert .nm{font-family:Fredoka;font-size:19mm;line-height:1;color:var(--c1);border-bottom:.8mm solid var(--c2);padding:0 6mm 2mm}
.cert .why{font-size:6mm;margin-top:5mm;max-width:210mm;line-height:1.35}
.cert .foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:4.2mm}
.cert .sig{width:70mm;text-align:center}.cert .sig .ln{border-top:.5mm solid #999;padding-top:1.5mm;font-weight:800}.cert .sig .rl{color:#666;font-size:3.8mm}
.cert .seal{width:30mm;height:30mm;border-radius:50%;background:radial-gradient(circle,var(--c2) 55%,var(--c1) 56%);display:flex;align-items:center;justify-content:center;font-size:14mm;box-shadow:0 1mm 0 rgba(0,0,0,.15)}
.scale{transform-origin:top left}
#printarea{display:none}
@media print{@page{size:A4 landscape;margin:0}body *{visibility:hidden}#printarea,#printarea *{visibility:visible}#printarea{display:block;position:absolute;left:0;top:0}header,main,footer{display:none}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;z-index:60;display:none}
</style>
</head>
<body>
<header><div style="font-size:30px">🎓</div><div><div class="t">Spelling Bee — Certificates</div><div class="s">Celebrate every speller</div></div><div class="right"><a href="teacher.html">← Teacher page</a></div></header>
<main id="app"><p class="muted">Loading…</p></main>
<footer style="text-align:center;padding:24px;font-size:13px;color:#6B7280;font-weight:700">Powered by <a href="https://thinknestonline.com" target="_blank" rel="noopener" style="color:#1B3A6B">ThinkNest</a></footer>
<div id="printarea"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
const SUPABASE_URL='https://xpbkdnkfufkahaszfycd.supabase.co';
const SUPABASE_KEY='sb_publishable_QIAV_9tLUBbDCu7FHqaTEw_zYQ0teEG';
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tT);tT=setTimeout(()=>t.style.display='none',2600)}
function teamOf(g){g=+g;return g===0?'buz':g===1?'hon':g<=3?'bum':'cha'}
function GL(g){return +g===0?'KG2':'Grade '+g}
function av(a,px){try{return window.SBAvatar.svg(a||{},px)}catch(e){return ''}}
const THEMES={honey:{n:'Honey & navy',c1:'#1B3A6B',c2:'#F5B700',ink:'#1F2A44'},garden:{n:'Pink garden',c1:'#9D174D',c2:'#F9A8D4',ink:'#3B1129'},sky:{n:'Sky blue',c1:'#1E40AF',c2:'#93C5FD',ink:'#14234B'},royal:{n:'Royal purple',c1:'#5B21B6',c2:'#C4B5FD',ink:'#24104F'},mint:{n:'Mint green',c1:'#166534',c2:'#86EFAC',ink:'#14301F'}};
const TYPES=[
 {id:'secure25',e:'⭐',kick:'Star Speller',title:'Star Speller Award',why:n=>`for making <b>25 spelling words</b> secure in the Spelling Bee. Keep shining!`,earn:k=>secure(k)>=25},
 {id:'secure50',e:'🌟',kick:'Super Speller',title:'Super Speller Award',why:()=>`for making <b>50 spelling words</b> secure in the Spelling Bee. Super spelling!`,earn:k=>secure(k)>=50},
 {id:'master',e:'🏆',kick:'Word Master',title:'Word Master Award',why:()=>`for making <b>every word</b> on their spelling list secure. Outstanding!`,earn:k=>{const t=TOT[teamOf(k.grade)]||0;return t>0&&secure(k)>=t}},
 {id:'streak',e:'🔥',kick:'Streak Star',title:'Practice Streak Award',why:()=>`for practising spelling <b>every day for a week</b>. Amazing effort!`,earn:k=>(PROG[k.id]?.best_streak||0)>=7},
 {id:'race',e:'🏁',kick:'Race Champion',title:'Race Champion Award',why:()=>`for winning a <b>Spelling Bee race</b> against their friends. Speedy spelling!`,earn:k=>(WINS[k.id]||0)>=1},
 {id:'finalist',e:'🎤',kick:'Grand Final Speller',title:'Spelling Bee Finalist',why:()=>`for taking part in <b>The Big Spelling Bee Grand Final</b>. We are so proud of you!`,earn:k=>FINAL.has(k.id)},
 {id:'champion',e:'🥇',kick:'Champion',title:'Spelling Bee Champion',why:()=>`for winning <b>The Big Spelling Bee</b>. A true champion speller!`,earn:k=>CHAMP.has(k.id)},
 {id:'custom',e:'✨',kick:'Well done',title:'Certificate of Achievement',why:()=>`for wonderful work in the Spelling Bee.`,earn:()=>false}];
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
let KIDS=[],PROG={},WINS={},TOT={},FINAL=new Set(),CHAMP=new Set();
function secure(k){const w=PROG[k.id]?.words||{};return Object.values(w).filter(v=>+v>=2).length}
let ST={type:'secure25',theme:'honey',grade:'all',cls:'all',sel:new Set(),logo:'',sig1:'',role1:'Class Teacher',sig2:'',role2:'',date:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),title:'',why:'',school:''};
try{const s=JSON.parse(localStorage.getItem('sb-cert')||'{}');['theme','logo','sig1','role1','sig2','role2','school'].forEach(k=>{if(s[k]!=null)ST[k]=s[k]})}catch(e){}
function keep(){try{localStorage.setItem('sb-cert',JSON.stringify({theme:ST.theme,logo:ST.logo,sig1:ST.sig1,role1:ST.role1,sig2:ST.sig2,role2:ST.role2,school:ST.school}))}catch(e){}}

async function start(){
 if(!sb){$('#app').innerHTML='<div class="card">Can’t connect.</div>';return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('#app').innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h2>Please sign in first</h2><p class="muted">Sign in on the teacher page, then come back here.</p><a href="teacher.html"><button class="y">Go to the teacher page</button></a></div>`;return}
 const [{data:k},{data:p},{data:w},{data:rw},{data:br}]=await Promise.all([
  sb.from('students').select('*').eq('active',true).order('grade').order('class_name').order('first_name'),
  sb.from('progress').select('*'),sb.rpc('public_words'),sb.from('race_wins').select('student_id'),sb.from('bee_rounds').select('kind,state')]);
 KIDS=k||[];(p||[]).forEach(x=>PROG[x.student_id]=x);
 (Array.isArray(w)?w:[]).forEach(r=>TOT[r.team]=(TOT[r.team]||0)+1);
 (rw||[]).forEach(r=>WINS[r.student_id]=(WINS[r.student_id]||0)+1);
 (br||[]).forEach(r=>{const s=r.state||{};if(r.kind==='final'){(s.spellers||[]).forEach(x=>FINAL.add(x.id));if(s.winner)CHAMP.add(s.winner)}});
 render()}
function typ(){return TYPES.find(t=>t.id===ST.type)}
function visible(){return KIDS.filter(k=>(ST.grade==='all'||k.grade==ST.grade)&&(ST.cls==='all'||k.class_name===ST.cls))}
function certHTML(k){const t=typ(),th=THEMES[ST.theme];const title=ST.type==='custom'&&ST.title?ST.title:t.title;const why=ST.type==='custom'&&ST.why?esc(ST.why):t.why(k.first_name);
 const combs=`<svg class="combs CL" viewBox="0 0 100 100"><defs><pattern id="hc${'X'}" width="12" height="20.78" patternUnits="userSpaceOnUse"><polygon points="6,0 12,3.46 12,10.39 6,13.86 0,10.39 0,3.46" fill="none" stroke="${th.c2}" stroke-width="1"/><polygon points="12,10.39 18,13.86 18,20.78 12,24.25 6,20.78 6,13.86" fill="none" stroke="${th.c2}" stroke-width="1"/></pattern></defs><path d="M0 0 H100 L0 100Z" fill="url(#hcX)"/></svg>`;
 return `<div class="cert" style="--c1:${th.c1};--c2:${th.c2};--cink:${th.ink}">${combs.replace('CL','tl')}${combs.replace('CL','br')}<div class="frame"></div><div class="frame2"></div>
 <div class="inner"><div class="logo">${ST.logo?`<img src="${ST.logo}" alt="">`:`<span style="font-size:14mm">🐝</span>`}</div>
  <div class="kicker">${t.e} ${esc(t.kick)} ${t.e}</div><div class="ttl">${esc(title)}</div>
  <div class="pres">This certificate is proudly presented to</div>
  <div class="who">${av(PROG[k.id]?.avatar,Math.round(38*3.78))}<div class="nm">${esc(k.first_name)}</div></div>
  <div class="why">${why}</div>
  <div class="foot"><div class="sig">${ST.sig1?`<div class="ln">${esc(ST.sig1)}</div><div class="rl">${esc(ST.role1)}</div>`:'<div class="ln">&nbsp;</div><div class="rl">Signature</div>'}</div>
   <div style="text-align:center"><div class="seal">${t.e}</div><div style="margin-top:2mm;font-weight:800">${esc(ST.date)}</div>${ST.school?`<div class="small" style="font-size:3.8mm;color:#666">${esc(ST.school)}</div>`:''}</div>
   <div class="sig">${ST.sig2?`<div class="ln">${esc(ST.sig2)}</div><div class="rl">${esc(ST.role2)}</div>`:'<div class="ln">&nbsp;</div><div class="rl">Signature</div>'}</div></div></div></div>`}
function render(){const t=typ();const list=visible();const classes=[...new Set(KIDS.filter(k=>ST.grade==='all'||k.grade==ST.grade).map(k=>k.class_name).filter(Boolean))].sort();
 const chosen=KIDS.filter(k=>ST.sel.has(k.id));const prevKid=chosen[0]||list.find(k=>t.earn(k))||list[0]||{first_name:'Speller',id:'-',grade:2};
 const nEarn=list.filter(k=>t.earn(k)).length;
 $('#app').innerHTML=`<div class="layout"><div class="card">
  <h3 style="font-size:19px">1. Choose a certificate</h3><div class="types" style="margin-top:8px">${TYPES.map(x=>`<button class="${ST.type===x.id?'on':''}" data-type="${x.id}">${x.e} ${esc(x.kick)}</button>`).join('')}</div>
  ${ST.type==='custom'?`<label>Title</label><input id="ctitle" value="${esc(ST.title)}" placeholder="Certificate of Achievement"><label>What it’s for</label><textarea id="cwhy" rows="2" placeholder="for wonderful work in the Spelling Bee.">${esc(ST.why)}</textarea>`:''}
  <h3 style="font-size:19px;margin-top:16px">2. Choose children</h3>
  <div class="row" style="margin:8px 0"><select id="fg" style="flex:1"><option value="all">All grades</option>${[0,1,2,3,4,5].map(g=>`<option value="${g}" ${ST.grade==g?'selected':''}>${GL(g)}</option>`).join('')}</select><select id="fc" style="flex:1"><option value="all">All classes</option>${classes.map(c=>`<option ${ST.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
  <div class="row" style="margin-bottom:8px">${ST.type!=='custom'?`<button class="y sm" id="tickEarned" ${nEarn?'':'disabled'}>Tick the ${nEarn} who earned it</button>`:''}<button class="w sm" id="tickAll">Tick all shown</button><button class="w sm" id="tickNone">Clear</button></div>
  <div class="kids">${list.map(k=>`<label><input type="checkbox" data-k="${k.id}" ${ST.sel.has(k.id)?'checked':''}>${av(PROG[k.id]?.avatar,26)}<span>${esc(k.first_name)} <span class="muted small">${esc(k.class_name||GL(k.grade))}</span></span>${t.earn(k)?'<span class="earned">✓ earned</span>':''}</label>`).join('')||'<p class="muted small">No children here yet.</p>'}</div>
  <h3 style="font-size:19px;margin-top:16px">3. Design</h3>
  <div class="swatches" style="margin-top:8px">${Object.entries(THEMES).map(([k,v])=>`<button class="swatch ${ST.theme===k?'on':''}" data-theme="${k}" title="${v.n}" style="background:${v.c2};border-color:${v.c1}"></button>`).join('')}</div>
  <label>School logo (optional)</label><div class="logobox">${ST.logo?`<img src="${ST.logo}" alt=""><button class="w sm" id="nologo">Remove</button>`:''}<input type="file" id="logo" accept="image/*" style="width:auto"></div>
  <label>School or event name (optional)</label><input id="school" value="${esc(ST.school)}" placeholder="e.g. The Big Spelling Bee 2027">
  <label>Date</label><input id="date" value="${esc(ST.date)}">
  <div class="row"><div style="flex:1"><label>Signed by</label><input id="sig1" value="${esc(ST.sig1)}" placeholder="Name"></div><div style="flex:1"><label>Role</label><input id="role1" value="${esc(ST.role1)}"></div></div>
  <div class="row"><div style="flex:1"><label>Second signature</label><input id="sig2" value="${esc(ST.sig2)}" placeholder="Name (optional)"></div><div style="flex:1"><label>Role</label><input id="role2" value="${esc(ST.role2)}"></div></div>
 </div><div>
  <div class="card"><div class="row"><h3 style="font-size:19px">Preview</h3><span class="muted small">${chosen.length?'Showing '+esc(prevKid.first_name)+"'s certificate":'Tick children to print their certificates'}</span><div class="spacer"></div><button class="y" id="print" ${chosen.length?'':'disabled'}>🖨 Print ${chosen.length||''} certificate${chosen.length===1?'':'s'}</button></div>
   <div class="preview" style="margin-top:12px"><div class="scale" id="sc">${certHTML(prevKid)}</div></div>
   <p class="small muted">Prints on A4 landscape, one certificate per page. In the print window, choose <b>Landscape</b> and turn off <b>Headers and footers</b> if they appear.</p></div></div></div>`;
 fit();bind()}
function fit(){const sc=$('#sc');if(!sc)return;const w=sc.parentElement.clientWidth-32;const k=Math.min(1,w/(297*3.78));sc.style.transform=`scale(${k})`;sc.parentElement.style.height=(210*3.78*k+32)+'px'}
addEventListener('resize',fit);
function bind(){document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{ST.type=b.dataset.type;ST.sel.clear();render()});
 document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{ST.theme=b.dataset.theme;keep();render()});
 $('#fg').onchange=e=>{ST.grade=e.target.value;ST.cls='all';render()};$('#fc').onchange=e=>{ST.cls=e.target.value;render()};
 const te=$('#tickEarned');if(te)te.onclick=()=>{visible().filter(k=>typ().earn(k)).forEach(k=>ST.sel.add(k.id));render()};
 $('#tickAll').onclick=()=>{visible().forEach(k=>ST.sel.add(k.id));render()};$('#tickNone').onclick=()=>{ST.sel.clear();render()};
 document.querySelectorAll('[data-k]').forEach(c=>c.onchange=()=>{c.checked?ST.sel.add(c.dataset.k):ST.sel.delete(c.dataset.k);render()});
 ['school','date','sig1','role1','sig2','role2'].forEach(id=>{const i=$('#'+id);i.onchange=()=>{ST[id]=i.value;keep();render()}});
 const ct=$('#ctitle');if(ct)ct.onchange=()=>{ST.title=ct.value;render()};const cw=$('#cwhy');if(cw)cw.onchange=()=>{ST.why=cw.value;render()};
 $('#logo').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{ST.logo=await shrink(f);keep();render();toast('Logo added ✓')}catch(err){toast('Couldn’t read that image')}};
 const nl=$('#nologo');if(nl)nl.onclick=()=>{ST.logo='';keep();render()};
 $('#print').onclick=()=>{const kids=KIDS.filter(k=>ST.sel.has(k.id));$('#printarea').innerHTML=kids.map(certHTML).join('');setTimeout(()=>window.print(),300)}}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const make=max=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png')};let out=make(480);if(out.length>350000)out=make(320);res(out)};img.src=r.result};r.readAsDataURL(file)})}
start();
})();
</script>
</body>
</html>
