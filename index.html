<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spelling Bee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:19px;border:0;border-radius:18px;padding:13px 22px;cursor:pointer;background:var(--aa);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.y{background:var(--honey);color:var(--ink)}button.w{background:#fff;color:var(--aa);border:2px solid var(--line)}button.r{background:var(--aa2)}button.g{background:var(--ok)}
button:disabled{opacity:.45}
.top{background:var(--aa);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.top .t{font-family:Fredoka;font-size:20px}.top .s{font-size:13px;opacity:.75}
.top .stars{margin-left:auto;background:rgba(255,255,255,.14);padding:7px 14px;border-radius:999px;font-family:Fredoka;font-size:18px}
.top button{font-size:15px;padding:8px 14px;border-radius:12px;box-shadow:none;background:rgba(255,255,255,.15)}
main{max-width:980px;margin:0 auto;padding:20px 18px 50px}
.hero{position:relative;overflow:hidden;background:var(--aa);color:#fff;text-align:center;padding:34px 20px 54px;border-radius:0 0 38px 38px}
.hero h1{font-size:clamp(40px,8vw,80px);color:var(--honey2);line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.hero h1 small{display:block;font-size:.45em;color:#fff;margin-bottom:6px}
.hero p{font-family:Fredoka;font-size:clamp(18px,3vw,26px);margin:12px 0 0}
.combs{position:absolute;inset:0;opacity:.13;pointer-events:none}
.flybee{position:absolute;width:76px;height:76px;animation:fly 10s ease-in-out infinite}
@keyframes fly{0%{left:5%;top:60%}25%{left:35%;top:8%;transform:rotate(8deg)}50%{left:84%;top:35%;transform:scaleX(-1)}75%{left:58%;top:70%;transform:scaleX(-1) rotate(6deg)}100%{left:5%;top:60%}}
.wing{animation:flap .18s ease-in-out infinite alternate;transform-origin:center bottom}@keyframes flap{to{transform:scaleY(.55)}}
.h2{text-align:center;font-size:clamp(26px,4vw,36px);margin:28px 0 16px}
.teams{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.team{border-radius:28px;padding:22px 16px;text-align:center;cursor:pointer;border:4px solid transparent;transition:transform .12s;background:#fff}
.team:hover{transform:translateY(-4px) rotate(-1deg)}
.team .e{font-size:62px;line-height:1}.team h3{font-size:25px;margin-top:8px}.team .gr{font-weight:800;opacity:.7}
.buz{background:#FFE8F1;border-color:#F9A8D4}.hon{background:#FFF4CC;border-color:#FFD54A}.bum{background:#E0ECFF;border-color:#93C5FD}.cha{background:#EFE7FF;border-color:#C4B5FD}
.act.games{background:linear-gradient(135deg,#FFF3C4,#FFE7A0);border-color:var(--honey)}
.act.game{position:relative}.gwon{margin-top:10px;font-family:Fredoka;font-size:16px;color:#8A5A00;background:var(--honeyL);display:inline-block;padding:4px 12px;border-radius:99px}
.gend{text-align:center;margin-top:16px}.gend h2{margin:6px 0}
.hive{position:relative;margin:8px 0 18px;padding:34px 10px 6px;background:linear-gradient(#EAF6FF,#FFFBEF);border-radius:24px;border:3px solid var(--line)}
.stops{display:flex;justify-content:space-between;align-items:flex-end}.stop{font-size:clamp(22px,4.5vw,38px);flex:1;text-align:center;transition:transform .3s}.stop.past{opacity:.8}.stop.home{font-size:clamp(34px,7vw,56px)}
.flyer{position:absolute;top:0;font-size:clamp(28px,5vw,44px);transform:translateX(-50%);transition:left 1s cubic-bezier(.5,-0.3,.4,1.4)}
.buzz{animation:buzz .5s}@keyframes buzz{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
.gkey{text-align:center;color:var(--ink2);font-size:15px;margin:6px 0 10px}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;background:#E9DCC0;padding:12px;border-radius:22px;border:3px solid #D9C69C}
.plot{background:#B9935A;border-radius:14px;text-align:center;padding:6px 4px;cursor:pointer;color:#fff}.plot span{font-size:34px;display:block;line-height:1.2}.plot small{font-size:12px;font-weight:700;word-break:break-word}
.plot.secure{background:#7CC47F}.plot.almost{background:#A58B57}.plot.tricky{background:#9C7A47}
.plot.grow span{animation:grow .9s}@keyframes grow{0%{transform:scale(.2)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.race{margin:8px 0 18px;display:flex;flex-direction:column;gap:8px}
.lane{position:relative;height:64px;border-radius:18px;background:repeating-linear-gradient(90deg,#FFF3C4 0 40px,#FFE9A3 40px 80px);border:3px solid var(--line);overflow:hidden}
.lane.them{background:repeating-linear-gradient(90deg,#E3EFFF 0 40px,#D2E4FF 40px 80px)}
.lane .who{position:absolute;left:10px;top:2px;font-family:Fredoka;font-size:13px;color:var(--ink2)}
.runner{position:absolute;top:14px;font-size:38px;transition:left .8s ease-out;transform:scaleX(-1)}.runner.opp{filter:hue-rotate(180deg) saturate(1.6);transition:none}
.flag{position:absolute;right:8px;top:12px;font-size:34px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}.slots span{width:clamp(30px,6vw,46px);height:clamp(40px,8vw,56px);border-bottom:5px solid var(--honey);font-family:Fredoka;font-size:clamp(24px,5vw,36px);display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px 10px 0 0}.slots span.in{background:var(--okL);border-color:var(--ok)}
.sky{position:relative;height:min(420px,58vh);border-radius:24px;overflow:hidden;background:linear-gradient(#BFE3FF,#EAF6FF 70%,#CDEBB5 70%);border:3px solid var(--line);touch-action:manipulation}
.lanehit{position:absolute;top:0;bottom:0;width:25%;cursor:pointer}.lanehit:nth-child(1){left:0}.lanehit:nth-child(2){left:25%}.lanehit:nth-child(3){left:50%}.lanehit:nth-child(4){left:75%}
.drop{position:absolute;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:#fff;border:4px solid var(--honey);font-family:Fredoka;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.08);pointer-events:none}
.jar{position:absolute;bottom:10px;font-size:58px;transform:translateX(-50%);transition:left .18s;pointer-events:none}
.jar.yum{animation:yum .4s}@keyframes yum{50%{transform:translateX(-50%) scale(1.3)}}
.jar.buzz{animation:jbuzz .5s}@keyframes jbuzz{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-62%)}75%{transform:translateX(-38%)}}
button.mv{font-size:28px;padding:10px 34px}
.bscene{position:relative;height:230px;margin:6px auto 0;max-width:420px}
.bset{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;gap:2px}
.bl{font-size:46px;display:inline-block;transform:rotate(var(--r));transform-origin:50% 140%;transition:opacity .3s,transform .3s;animation:bob 2.6s ease-in-out infinite}
.bl:nth-child(even){animation-delay:.6s}.bl.gone{opacity:0;transform:scale(.2)}
.bl.popping{animation:pop .35s forwards}@keyframes pop{0%{opacity:1;transform:scale(1)}60%{transform:scale(1.5)}100%{opacity:0;transform:scale(.1)}}
@keyframes bob{50%{translate:0 -6px}}
.bstrings{position:absolute;left:50%;top:62px;width:2px;height:90px;background:#9AA4B8;transform:translateX(-50%)}
.bbee{position:absolute;left:50%;top:140px;font-size:64px;transform:translateX(-50%);animation:bob 2.6s ease-in-out infinite}
.bbee.fall{animation:none;top:160px;transform:translateX(-50%) rotate(20deg);transition:top .6s}
.kb.hm button.good{background:var(--okL);border-color:#A7E3BF;color:#166534}.kb.hm button.bad{background:#EEE;color:#AAA;text-decoration:line-through}
.kb.hm button:disabled{cursor:default}
.slots span.miss{background:var(--badL);border-color:var(--bad);color:var(--bad)}
.fgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}.fgrid .panel{text-align:center}
.fcode{font-family:Fredoka;font-size:clamp(54px,12vw,92px);letter-spacing:.08em;color:var(--aa);margin:4px 0 10px}
.fplayers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}.fplayers span{font-family:Fredoka;font-size:20px;background:var(--honeyL);border:3px solid var(--honey);padding:8px 16px;border-radius:99px}
.fplayers .fwait{background:#fff;border-style:dashed;color:var(--ink2);animation:bob 1.6s infinite}
.lane.me{box-shadow:0 0 0 3px var(--honey)}
.acts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.act{background:#fff;border-radius:26px;padding:22px;text-align:center;border:3px solid var(--line);cursor:pointer;transition:transform .12s}
.act:hover{transform:translateY(-4px)}
.act .e{font-size:54px}.act h3{font-size:24px;margin:6px 0}.act p{margin:0;color:var(--ink2);font-size:15.5px}
.panel{background:#fff;border-radius:28px;padding:24px;border:3px solid var(--line);text-align:center}
.big{font-family:Fredoka;font-size:clamp(40px,9vw,72px);letter-spacing:.03em;margin:10px 0;word-break:break-word}
.hear{font-size:24px;padding:18px 30px;border-radius:999px}
.ans{font-family:Fredoka;font-size:clamp(28px,6vw,42px);text-align:center;letter-spacing:.08em;width:100%;max-width:520px;padding:12px 16px;border:4px solid var(--honey);border-radius:20px;background:var(--honeyL);color:var(--ink);outline:none}
.kb{display:flex;flex-direction:column;gap:7px;align-items:center;margin-top:16px}
.kb .r{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
.kb button{width:clamp(28px,8vw,52px);height:clamp(40px,10vw,56px);padding:0;font-size:clamp(17px,4vw,24px);border-radius:12px;background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.kb button.wide{width:auto;padding:0 16px;background:var(--honeyL)}
.fb{font-family:Fredoka;font-size:26px;padding:14px;border-radius:20px;margin-top:14px}
.fb.ok{background:var(--okL);color:#166534}.fb.bad{background:var(--badL);color:#991B1B}
.prog{height:16px;background:#F3EBD2;border-radius:99px;overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;background:var(--honey);border-radius:99px;transition:width .3s}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.blanks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.blanks span{font-family:Fredoka;font-size:clamp(30px,7vw,52px);min-width:clamp(32px,7vw,54px);padding:4px 6px;border-bottom:5px solid var(--ink);text-align:center}
.blanks span.gap{border-color:var(--honey);color:var(--aa2);background:var(--honeyL);border-radius:10px 10px 0 0}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tiles button{width:64px;height:64px;padding:0;font-size:30px;background:var(--honey);color:var(--ink)}
.wordgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:16px}
.wc{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px;font-family:Fredoka;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.wc.secure{border-color:#7FB3F5;background:#E3EFFF}
.wc.almost{border-color:#A7E3BF;background:var(--okL)}
.wc.tricky{border-color:#F2C230;background:#FFF2B8}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 16px}
.legend span{font-family:Fredoka;font-size:16px;padding:6px 14px;border-radius:999px;border:3px solid}
.legend .secure{background:#E3EFFF;border-color:#7FB3F5}.legend .almost{background:var(--okL);border-color:#A7E3BF}.legend .tricky{background:#FFF2B8;border-color:#F2C230}
.vback{position:fixed;inset:0;background:rgba(20,26,43,.55);display:grid;place-items:center;z-index:30;padding:16px}
.vcard{background:#fff;border-radius:26px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.vlist{display:grid;gap:8px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:16px}
.vrow.on{border-color:var(--ok);background:var(--okL)}
.vrow button{font-size:15px;padding:8px 12px;border-radius:12px;box-shadow:none}
.wc{transition:transform .15s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none}
.wc:hover{border-color:var(--honey)}
.talking{animation:talk .45s ease-in-out 3}
.wc.talking{background:var(--honeyL);border-color:var(--honey)}
@keyframes talk{50%{transform:scale(1.08)}}
.back{background:#fff;color:var(--aa);border:2px solid var(--line);font-size:16px;padding:9px 16px;box-shadow:none}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.steps span{padding:6px 14px;border-radius:99px;background:#F1ECDD;font-weight:800;font-size:14px}.steps span.on{background:var(--honey)}
.result .e{font-size:80px}
.party{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:auto;background:rgba(255,251,239,.35);animation:pin .25s ease-out}
.party.out{animation:pout .4s ease-in forwards}
@keyframes pin{from{opacity:0}}@keyframes pout{to{opacity:0}}
.party .cf{position:absolute;top:-30px;width:12px;height:16px;border-radius:3px;font-style:normal;font-size:26px;line-height:1;animation:cfall 2s linear forwards}
.party .cf:not(:empty){width:auto;height:auto;background:none}
@keyframes cfall{to{transform:translateY(112vh) rotate(540deg)}}
.pcard{position:relative;background:#fff;border:5px solid var(--honey);border-radius:36px;padding:26px 38px;text-align:center;box-shadow:0 18px 50px rgba(31,42,68,.25);animation:ppop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes ppop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.pemo{font-size:96px;line-height:1;animation:pjump .7s ease-in-out infinite alternate}
@keyframes pjump{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-16px) rotate(6deg)}}
.pcheer{font-family:Fredoka;font-weight:700;font-size:clamp(34px,7vw,56px);color:var(--aa);margin-top:6px}
.pstreak{font-family:Fredoka;font-size:24px;color:var(--aa2);margin-top:4px}
.pclap{font-size:44px;margin-top:4px;animation:pclap .3s ease-in-out infinite alternate}@keyframes pclap{to{transform:scale(1.18) rotate(-6deg)}}
.pstar{display:inline-block;margin-top:12px;background:var(--honey);color:var(--ink);font-family:Fredoka;font-size:26px;padding:6px 18px;border-radius:999px;animation:pjump .5s ease-in-out infinite alternate}
.stars.pop{animation:spop .6s ease}@keyframes spop{40%{transform:scale(1.4);background:var(--honey);color:var(--ink)}}

.burst i{position:absolute;top:-40px;font-style:normal;font-size:30px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.codecard{max-width:620px;margin:0 auto;background:#fff;border:4px solid var(--honey);border-radius:30px;padding:26px 22px;text-align:center;box-shadow:0 10px 0 var(--honeyL)}
.codecard.buz{border-color:#F9A8D4}.codecard.hon{border-color:#FFD54A}.codecard.bum{border-color:#93C5FD}.codecard.cha{border-color:#C4B5FD}
.codemsg{display:none;margin-top:12px;background:var(--badL);color:#991B1B;font-weight:800;padding:10px 14px;border-radius:14px}.codemsg.show{display:block}
.team.still{cursor:default}.team.still:hover{transform:none}
.gapsent{font-family:Fredoka,Nunito,sans-serif;font-size:clamp(24px,4.4vw,36px);line-height:1.5;margin:18px auto;max-width:760px}
.gapb{display:inline-block;min-width:4.2em;border-bottom:5px solid var(--honey);background:var(--honeyL);border-radius:10px 10px 0 0;color:var(--honey);text-align:center;margin:0 4px;animation:gapp 1.2s ease-in-out infinite}
@keyframes gapp{50%{background:#FFE58A}}
.gapw{padding:0 8px;border-radius:10px;font-weight:700}.gapw.ok{background:var(--okL);color:#166534}.gapw.bad{background:var(--honeyL);color:var(--aa)}

.sec2{scroll-margin-top:70px;margin-top:10px}
.about{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

.lead2{text-align:center;font-size:18px;margin:18px auto 0;max-width:640px;font-weight:700}
.countbox{background:var(--aa);color:#fff;border-radius:24px;padding:16px 22px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:16px;font-size:18px}
.countbox .n{font-family:Fredoka;font-size:52px;color:var(--honey2);line-height:1}
.dates{display:grid;gap:10px}
.date{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;background:#fff;border-radius:20px;padding:14px 18px;border:3px solid var(--line)}
.date .when{font-family:Fredoka;font-size:19px;color:var(--aa2)}.date b{font-family:Fredoka;font-size:20px}.date p{margin:3px 0 0;color:var(--ink2);font-size:15.5px}
.date.final{border-color:var(--honey);background:var(--honeyL)}
.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.rule{background:#fff;border-radius:18px;padding:14px 16px;border:3px solid var(--line);display:flex;gap:12px;align-items:center;font-size:16px}
.rule span{flex:none;width:38px;height:38px;border-radius:12px;background:var(--honey);display:grid;place-items:center;font-family:Fredoka;font-size:19px}
.powered{margin-top:14px;font-size:14px;font-weight:700;color:var(--ink2)}.powered a{color:var(--aa);text-decoration:none;border-bottom:2px solid var(--honey)}.powered a:hover{color:var(--aa2)}

@media (max-width:600px){.date{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){.flybee,.wing,.burst i{animation:none}}
</style>
</head>

/* Spelling test */

 const need=idxs.map(i=>w[i].toLowerCase());const letters='abcdefghijklmnopqrstuvwxyz';const extra=shuffle([...letters].filter(c=>!need.includes(c))).slice(0,Math.max(3,6-need.length));

function newGap(){const p=prog(V.team);const ws=shuffle(gapWords());const fresh=ws.filter(w=>wordLevel(V.team,w)!=='secure');const list=(fresh.length>=10?fresh:fresh.concat(ws.filter(w=>!fresh.includes(w)))).slice(0,10);GP={list,i:0,val:'',fb:null,score:0,missed:[],done:false}}

 {id:'ghive',e:'🐝',name:'Bee to the Hive',p:'Spell words to fly the bee from flower to flower, all the way home!'},

 return [...t,...a,...f,...s].slice(0,n).sort(()=>Math.random()-.5)}
function gGood(){STREAK++;happySound(STREAK>=3);setTimeout(()=>clapSound(STREAK>=3),120);setTimeout(()=>praise(pick(CHEERS)[1],true),400);

 let quiet=0;(function tick(){const el=performance.now()-t0;if(el<(minMs||1300)){setTimeout(tick,150);return}if(busy()){quiet=0}else quiet+=150;if(quiet>=450||el>9000)fn();else setTimeout(tick,150)})()}

 <div style="margin-top:16px"><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="spell it here" value="${esc(G.val||'')}" ${G.fb?'disabled':''}></div>

 `<div class="hive"><div class="stops">${stops}<div class="stop home">🍯</div></div><div class="flyer" id="flyer" style="left:${hx(G.shown,n)}%">🐝</div></div>

/* 3. Grow a Garden */
function plot(w,grow){const l=wordLevel(V.team,w);const e=l==='secure'?FLOWERS[[...w].reduce((a,c)=>a+c.charCodeAt(0),0)%FLOWERS.length]:l==='almost'?'🌱':l==='tricky'?'🌰':'🟫';
 return `<div class="plot ${l||'soil'} ${grow?'grow':''}" data-say="${esc(w)}" title="${esc(w)}"><span>${e}</span><small>${esc(w)}</small></div>`}
function gardenView(){const ws=WORDS[V.team];const bloom=ws.filter(w=>wordLevel(V.team,w)==='secure').length;
 const garden=`<div class="gkey">🌰 seed · 🌱 sprout · 🌻 flower (secure)</div><div class="garden">${ws.map(w=>plot(w,w===G.grown)).join('')}</div>`;
 if(G.done)return gHead('🌻 Grow a Garden')+`<div class="panel gend"><div style="font-size:70px">🌻🌷🌹</div><h2 class="f" style="font-size:30px">Your garden has ${bloom} flower${bloom===1?'':'s'}!</h2><p style="font-size:18px">You spelt ${G.score} of ${G.list.length} words right. Spell a word right twice to make it bloom.</p><div class="row" style="margin-top:12px"><button class="y" data-g="ggarden">Keep growing 🌱</button><button class="w" data-g="menu">More games</button></div></div>${garden}`;
 return gHead(`🌻 Grow a Garden · ${G.i+1} of ${G.list.length}`,`<p class="muted" style="text-align:center">🌻 ${bloom} of ${ws.length} flowers in bloom</p>`)+`<div class="panel" style="margin-bottom:16px">${gAsk()}</div>${garden}`}

/* 4. Bee Race */
function raceView(){
 if(G.done)return gHead('🏁 Bee Race')+(G.won?`<div class="panel gend"><div style="font-size:90px">🏆</div><h2 class="f" style="font-size:34px">You won the race!</h2><p style="font-size:20px">Your bee zoomed past the finish line. Super spelling!</p>`
  :`<div class="panel gend"><div style="font-size:80px">🐝💨</div><h2 class="f" style="font-size:32px">So close!</h2><p style="font-size:20px">The speedy bee won this time. Practise and race again!</p>`)+`<div class="row" style="margin-top:14px"><button class="y" data-g="grace">Race again 🔁</button><button class="w" data-g="menu">More games</button></div></div>`;
 return gHead('🏁 Bee Race',`<p class="muted" style="text-align:center">${G.timed?'The speedy bee keeps flying — spell fast and right!':'Each mistake helps the speedy bee. Spell carefully!'} ${G.goal-G.pos} words to the finish.</p>`)+
 `<div class="race"><div class="lane me"><span class="who">${esc(ME.first_name)}</span><div class="runner" id="meBee" style="left:${G.shown/G.goal*88}%">🐝</div><div class="flag">🏁</div></div>
 <div class="lane them"><span class="who">Speedy</span><div class="runner opp" id="oppBee" style="left:${G.opp*0.88}%">🐝</div><div class="flag">🏁</div></div></div>
 <div class="panel">${gAsk()}</div>`}
function raceAfter(){const f=$('#meBee');if(f&&G.shown!==G.pos)requestAnimationFrame(()=>{f.style.left=(G.pos/G.goal*88)+'%';G.shown=G.pos})}
function raceLoop(){if(!G||G.kind!=='grace'||V.screen!=='grace'||G.done)return;const now=performance.now();
 if(G.timed&&!G.fb){const dt=G.last?Math.min(now-G.last,200):0;const secs=V.team==='cha'?13:17;G.opp+=dt/1000*(100/(G.goal*secs))}
 G.last=now;const o=$('#oppBee');if(o)o.style.left=(Math.min(G.opp,100)*0.88)+'%';
 if(G.opp>=100){raceEnd(false);return}requestAnimationFrame(raceLoop)}
function raceEnd(won){G.done=true;G.won=won;render();window.scrollTo(0,0);if(won){gWin('grace');gBig()}else{gentleSound();setTimeout(()=>playClip(pick(ENCOURAGE)),400)}}

/* 2. Honey Catch */
function catchView(){
 if(G.done)return gHead('🍯 Honey Catch')+(G.hearts>0?`<div class="panel gend"><div style="font-size:90px">🍯</div><h2 class="f" style="font-size:34px">Jar full of honey!</h2><p style="font-size:20px">You caught all ${G.list.length} words. Sweet spelling!</p>`
  :`<div class="panel gend"><div style="font-size:80px">💛</div><h2 class="f" style="font-size:32px">Good try!</h2><p style="font-size:20px">You caught ${G.score} word${G.score===1?'':'s'}. Have another go!</p>`)+`<div class="row" style="margin-top:14px"><button class="y" data-g="gcatch">Play again 🔁</button><button class="w" data-g="menu">More games</button></div></div>`;
 const w=G.list[G.i];
 return gHead(`🍯 Honey Catch · ${G.i+1} of ${G.list.length}`,`<p class="muted" style="text-align:center">Listen, then catch the letters in order. ${'❤️'.repeat(G.hearts)}${'🤍'.repeat(3-G.hearts)}</p>`)+
 `<div class="row" style="margin-bottom:10px"><button class="y hear" data-sayw="${esc(w)}">🔊 Hear the word</button>${SENT[w]?`<button class="w" data-say="${esc(SENT[w])}">💬 Sentence</button>`:''}</div>
 <div class="slots" id="slots">${[...w].map((c,k)=>`<span class="${k<G.got.length?'in':''}">${k<G.got.length?esc(c):''}</span>`).join('')}</div>
 <div class="sky" id="sky">${[0,1,2,3].map(l=>`<div class="lanehit" data-glane="${l}"></div>`).join('')}<div class="jar" id="jar" style="left:${G.lane*25+12.5}%">🍯</div></div>
 <div class="row" style="margin-top:12px"><button class="w mv" data-gmove="-1">◀</button><button class="w mv" data-gmove="1">▶</button></div>
 <p class="muted" style="text-align:center;font-size:14px">Tap a lane, use ◀ ▶, or the arrow keys.</p>`}
function catchWave(){const w=G.list[G.i],need=w[G.got.length].toLowerCase();const ab='abcdefghijklmnopqrstuvwxyz';
 const lanes=shuffle([0,1,2,3]).slice(0,3);const dec=shuffle([...ab].filter(c=>c!==need)).slice(0,2);
 G.drops=lanes.map((l,k)=>({l,c:k===0?need:dec[k-1],y:-50,id:Math.random()}));
 const sky=$('#sky');if(!sky)return;sky.querySelectorAll('.drop').forEach(d=>d.remove());
 G.drops.forEach(d=>{const e=document.createElement('div');e.className='drop';e.textContent=d.c;e.style.left=(d.l*25+12.5)+'%';e.style.top=d.y+'px';d.el=e;sky.appendChild(e)})}
function catchLoop(){if(!G||G.kind!=='gcatch'||V.screen!=='gcatch'||G.done)return;const now=performance.now();const dt=G.last?Math.min(now-G.last,100):0;G.last=now;
 const sky=$('#sky');if(!sky){requestAnimationFrame(catchLoop);return}
 if(!G.drops.length||!G.drops[0].el||!G.drops[0].el.isConnected){if(now>=G.next)catchWave()}
 else{const H=sky.clientHeight,jarY=H-70;const sp={buz:55,hon:65,bum:85,cha:105}[V.team]||70;
  for(const d of G.drops){d.y+=sp*dt/1000;d.el.style.top=d.y+'px'}
  const hit=G.drops.find(d=>d.l===G.lane&&d.y>=jarY-30&&d.y<=jarY+20);
  if(hit){G.drops.forEach(d=>d.el.remove());G.drops=[];catchGot(hit.c)}
  else if(G.drops.every(d=>d.y>H)){G.drops.forEach(d=>d.el.remove());G.drops=[];G.next=now+300}}
 requestAnimationFrame(catchLoop)}
function catchGot(c){const w=G.list[G.i];const need=w[G.got.length].toLowerCase();const jar=$('#jar');
 if(c===need){G.got+=w[G.got.length];happySound(false);G.next=performance.now()+350;
  const sl=$('#slots');if(sl){const s=sl.children[G.got.length-1];s.textContent=w[G.got.length-1];s.className='in'}
  if(jar){jar.classList.remove('yum');void jar.offsetWidth;jar.classList.add('yum')}
  if(G.got.length===w.length){award(V.team,w,!G.wbad);if(!G.wbad)G.score++;gGood();G.next=performance.now()+99999;
   gAfterTalk(()=>{if(!G||G.kind!=='gcatch')return;if(G.i+1<G.list.length){G.i++;G.got='';G.wbad=false;G.drops=[];G.next=performance.now()+900;render();setTimeout(()=>sayWord(G.list[G.i]),200)}else{G.done=true;render();gWin('gcatch');gBig()}},1600)}}
 else{G.wbad=true;G.hearts--;gentleSound();G.next=performance.now()+700;if(jar){jar.classList.remove('buzz');void jar.offsetWidth;jar.classList.add('buzz')}
  const h=document.querySelector('main p.muted');if(h)h.innerHTML=`Oops, that was “${esc(c)}”. ${'❤️'.repeat(Math.max(G.hearts,0))}${'🤍'.repeat(3-Math.max(G.hearts,0))}`;
  if(G.hearts<=0){award(V.team,w,false);setTimeout(()=>{if(!G||G.kind!=='gcatch')return;G.done=true;render();setTimeout(()=>playClip(pick(ENCOURAGE)),200)},700)}}}
function catchMove(dx){if(!G||G.kind!=='gcatch')return;G.lane=Math.max(0,Math.min(3,G.lane+dx));const j=$('#jar');if(j)j.style.left=(G.lane*25+12.5)+'%'}

/* shared check / next */
function gCheck(){if(G&&G.kind==='gfriend'){fCheck();return}const v=readAns();if(!v||G.fb)return;const w=G.list[G.i];const ok=same(v,w);G.val=v;award(V.team,w,ok);
 if(ok){G.score++;G.fb='ok';if(G.kind==='ghive')G.pos++;if(G.kind==='grace')G.pos++;if(G.kind==='ggarden')G.grown=w;render();gGood();
  if((G.kind==='ghive'&&G.pos>=G.goal)){gAfterTalk(()=>{G.done=true;render();window.scrollTo(0,0);gWin('ghive');gBig()});return}
  if(G.kind==='grace'&&G.pos>=G.goal){gAfterTalk(()=>raceEnd(true));return}
  gAfterTalk(gNext)}
 else{G.wrong++;G.fb='bad';if(G.kind==='ghive'&&G.tries<10){G.list.push(w);G.tries++}if(G.kind==='grace'&&!G.timed)G.opp+=12.5;render();oops();
  const f=$('#flyer');if(f){f.classList.remove('buzz');void f.offsetWidth;f.classList.add('buzz')}
  if(G.kind==='grace'&&G.opp>=100)setTimeout(()=>raceEnd(false),1200)}}
function gNext(){if(!G||G.done)return;if(G.kind==='grace'&&!G.timed&&G.fb)G.opp+=6;
 if(G.kind==='grace'&&G.opp>=100){raceEnd(false);return}
 if(G.i+1>=G.list.length){if(G.kind==='grace'){raceEnd(G.pos>=G.goal);return}G.done=true;render();window.scrollTo(0,0);
  if(G.kind==='ggarden'){if(G.score>=G.list.length*0.7)gBig()}return}
 G.i++;G.val='';G.fb=null;G.grown=null;G.last=0;render();setTimeout(()=>sayWordSentence(G.list[G.i]),200)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-g],[data-gmove],[data-glane]');if(!b)return;const d=b.dataset;
 if(d.gmove){catchMove(+d.gmove);return}
 if(d.glane!==undefined){if(G&&G.kind==='gcatch'){G.lane=+d.glane;catchMove(0)}return}
 if(d.g==='menu'){G=null;V.screen='games';render();window.scrollTo(0,0);return}
 if(d.g==='check'){gCheck();return}
 if(d.g==='next'){if(G&&G.kind==='gfriend')fNext();else gNext();return}
 if(GAMES.some(x=>x.id===d.g))gStart(d.g)});
document.addEventListener('keydown',e=>{if(!G||G.kind!==V.screen)return;
 if(G.kind==='gcatch'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();catchMove(e.key==='ArrowLeft'?-1:1);return}
 if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();gCheck()}});
document.addEventListener('input',e=>{if(e.target.id==='ans'&&G)G.val=e.target.value});

/* 5. Balloon Rescue (child-friendly hangman) */
const BMAX=6;
function bShown(w,c){return !/[a-z]/i.test(c)||G.used.includes(c.toLowerCase())||G.lost}
function balloonView(){
 if(G.done){const win=G.saved>=Math.ceil(G.list.length*0.6);return gHead('🎈 Balloon Rescue')+`<div class="panel gend"><div style="font-size:84px">${win?'🎈🐝🎈':'💛'}</div><h2 class="f" style="font-size:32px">${win?'You rescued the bee!':'Good try!'}</h2><p style="font-size:20px">You saved ${G.saved} of ${G.list.length} words.${win?' The bee is flying high! 🏆':' Have another go!'}</p><div class="row" style="margin-top:14px"><button class="y" data-g="gballoon">Play again 🔁</button><button class="w" data-g="menu">More games</button></div></div>`}
 const w=G.list[G.i];const left=BMAX-G.pop;
 const balloons=Array.from({length:BMAX},(_,k)=>`<span class="bl ${k<left?'':'gone'}" style="--r:${(k-(BMAX-1)/2)*9}deg">🎈</span>`).join('');
 const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
 const keys=`<div class="kb hm">${rows.map(r=>`<div class="r">${[...r].map(c=>{const u=G.used.includes(c);const good=u&&w.toLowerCase().includes(c);return `<button data-hl="${c}" class="${u?(good?'good':'bad'):''}" ${u||G.lost||G.won?'disabled':''}>${c}</button>`}).join('')}</div>`).join('')}</div>`;
 return gHead(`🎈 Balloon Rescue · ${G.i+1} of ${G.list.length}`,`<p class="muted" style="text-align:center">Listen to the word, then tap its letters. ${left} balloon${left===1?'':'s'} left!</p>`)+
 `<div class="bscene"><div class="bset">${balloons}</div><div class="bstrings"></div><div class="bbee ${G.lost?'fall':''}">🐝</div></div>
 <div class="row" style="margin:10px 0"><button class="y hear" data-sayw="${esc(w)}">🔊 Hear the word</button>${SENT[w]?`<button class="w" data-say="${esc(SENT[w])}">💬 Sentence</button>`:''}</div>
 <div class="slots">${[...w].map(c=>`<span class="${bShown(w,c)?(G.lost&&!G.used.includes(c.toLowerCase())&&/[a-z]/i.test(c)?'miss':'in'):''}">${bShown(w,c)?esc(c):''}</span>`).join('')}</div>
 <div class="panel" style="padding:16px">${G.lost?`<div class="fb bad">The balloons popped! It’s spelt <u>${esc(w)}</u></div><div class="row" style="margin-top:12px"><button class="w" data-say="${esc(w)}">🔊 Hear it</button><button class="y" data-g="bnext">Keep going →</button></div>`:G.won?`<div class="fb ok">${pick(PRAISE)} ⭐</div>`:keys}</div>`}
function bGuess(c){if(!G||G.kind!=='gballoon'||G.lost||G.won||G.done)return;c=c.toLowerCase();if(G.used.includes(c))return;G.used+=c;const w=G.list[G.i];
 if(w.toLowerCase().includes(c)){happySound(false);
  if([...w].every(ch=>bShown(w,ch))){G.won=true;G.saved++;award(V.team,w,G.pop<=2);render();gGood();gAfterTalk(bNext);return}
  render()}
 else{G.pop++;gentleSound();
  if(G.pop>=BMAX){G.lost=true;award(V.team,w,false);render();setTimeout(()=>playClip(pick(ENCOURAGE)),500);return}
  render();const b=document.querySelectorAll('.bl:not(.gone)');const last=document.querySelectorAll('.bl')[BMAX-G.pop];if(last){last.classList.add('popping')}}}
function bNext(){if(!G||G.kind!=='gballoon')return;if(G.i+1<G.list.length){G.i++;G.used='';G.pop=0;G.lost=false;G.won=false;render();setTimeout(()=>sayWordSentence(G.list[G.i]),200)}
 else{G.done=true;render();window.scrollTo(0,0);if(G.saved>=Math.ceil(G.list.length*0.6)){gWin('gballoon');gBig()}else setTimeout(()=>playClip(pick(ENCOURAGE)),300)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-hl]');if(b){bGuess(b.dataset.hl);return}const n=e.target.closest('[data-g=bnext]');if(n)bNext()});
document.addEventListener('keydown',e=>{if(G&&G.kind==='gballoon'&&V.screen==='gballoon'&&/^[a-z]$/i.test(e.key)&&!e.metaKey&&!e.ctrlKey){bGuess(e.key)}});

/* 6. Race a friend (online, with a race code) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fWords(team,seed,n){const r=mulberry(seed);const a=WORDS[team].slice().sort();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const out=[];while(out.length<n&&a.length)out.push(a[out.length%a.length]);return out}
let FPOLL=null,FBUSY=false;
function fErr(e){return ({code:'Your bee code didn’t work. Ask your teacher.',notfound:'We couldn’t find that race code. Check it and try again!',started:'That race has already started. Ask your friend for a new code.',full:'That race is full (4 bees max).',notin:'You are not in this race.',net:'We couldn’t connect. Check the internet and try again.'})[e]||(e==='team'?'':'Something went wrong. Try again.')}
async function fCall(fn,args){const c=db();if(!c)return {error:'net'};try{const {data,error}=await c.rpc(fn,Object.assign({p_code:ME.code},args||{}));if(error||!data)return {error:'net'};return data}catch(e){return {error:'net'}}}
function fApply(d){if(!G||G.kind!=='gfriend')return;if(d.error){if(G.stage==='menu'||G.stage==='busy'){G.stage='menu';G.err=d.error==='team'?`That race is for the ${T(d.team)?.name||'other team'}. You can only race bees in your own team (${T(ME.team).name}).`:fErr(d.error);render()}return}
 const was=G.stage;G.data=d;G.code=d.code;{const m=d.players.find(p=>p.me);if(m&&(G.myPos||0)>m.pos)m.pos=G.myPos}
 if(!G.list)G.list=fWords(d.team,d.seed,d.goal+40);
 if(d.status==='wait'){G.stage='wait';if(was!=='wait'||G.nPl!==d.players.length){G.nPl=d.players.length;render();if(was==='wait')happySound(false)}fStartPoll();return}
 if(d.status==='go'&&d.starts_in>0&&was!=='race'){G.stage='count';G.startAt=performance.now()+d.starts_in*1000;if(was!=='count')render();fStartPoll();return}
 if(d.status==='go'){if(was!=='race'){G.stage='race';G.i=0;G.val='';G.fb=null;render();setTimeout(()=>sayWordSentence(G.list[0]),150)}else fLanes();fStartPoll();return}
 if(d.status==='done'&&was!=='end'){G.stage='end';fStopPoll();render();window.scrollTo(0,0);const me=d.players.find(p=>p.me);
  if(me&&me.done&&d.winner===ME.first_name){gWin('gfriend');gBig()}else{gentleSound();setTimeout(()=>playClip(pick(ENCOURAGE)),400)}}}
function fStartPoll(){if(FPOLL)return;FPOLL=setInterval(async()=>{if(!G||G.kind!=='gfriend'||V.screen!=='gfriend'){fStopPoll();return}
 if(G.stage==='count'){const s=Math.ceil((G.startAt-performance.now())/1000);const el=$('#fcount');if(el)el.textContent=s>0?s:'GO!';if(s<=0){G.stage='go-wait'}}
 if(FBUSY)return;FBUSY=true;try{fApply(await fCall('race_state',{p_race:G.code}))}finally{FBUSY=false}},700)}
function fStopPoll(){if(FPOLL){clearInterval(FPOLL);FPOLL=null}}
function fLanes(){const d=G.data;if(!d)return;d.players.forEach((p,k)=>{const b=document.getElementById('fb'+k);if(b)b.style.left=(Math.min(p.pos,d.goal)/d.goal*88)+'%'})}
function fLanesHTML(){const d=G.data;return `<div class="race">${d.players.map((p,k)=>`<div class="lane ${p.me?'me':'them'}"><span class="who">${esc(p.name)}${p.me?' (you)':''}</span><div class="runner ${p.me?'':'opp'}" id="fb${k}" style="left:${Math.min(p.pos,d.goal)/d.goal*88}%">🐝</div><div class="flag">🏁</div></div>`).join('')}</div>`}
function friendView(){const head=gHead('🌐 Race a friend');
 if(!db())return head+`<div class="panel gend"><p style="font-size:20px">Racing a friend needs the internet. Please try again later.</p></div>`;
 if(G.stage==='menu'||G.stage==='busy')return head+`<div class="fgrid">
  <div class="panel"><div style="font-size:60px">🏁</div><h3 class="f" style="font-size:26px;margin:6px 0">Start a race</h3><p class="muted">Get a race code and tell it to your friend.</p><button class="y" data-f="create" ${G.stage==='busy'?'disabled':''}>Get a race code</button></div>
  <div class="panel"><div style="font-size:60px">🤝</div><h3 class="f" style="font-size:26px;margin:6px 0">Join a race</h3><p class="muted">Type the race code your friend gives you.</p><input id="fjoin" class="ans" style="max-width:260px;text-transform:uppercase;font-size:30px" maxlength="8" placeholder="BEE-42" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(G.join||'')}"><div style="margin-top:12px"><button class="y" data-f="join" ${G.stage==='busy'?'disabled':''}>Join 🐝</button></div></div></div>
  ${G.err?`<div class="fb bad" style="margin-top:14px">${esc(G.err)}</div>`:''}
  <p class="muted" style="text-align:center;margin-top:14px">You can race up to 3 friends from your team (${T(ME.team).name}). Everyone gets the same words!</p>`;
 const d=G.data;
 if(G.stage==='wait'){const n=d.players.length;return head+`<div class="panel gend"><p class="muted" style="font-size:18px">Your race code is</p><div class="fcode">${esc(d.code)}</div><p style="font-size:18px">Tell your friend to tap <b>🌐 Race a friend → Join a race</b> and type this code.</p>
  <div class="fplayers">${d.players.map(p=>`<span>🐝 ${esc(p.name)}${p.me?' (you)':''}</span>`).join('')}${n<4?'<span class="fwait">waiting…</span>':''}</div>
  ${d.host?(n>=2?`<button class="y" style="font-size:24px;padding:14px 34px" data-f="start">Start the race! 🏁</button>`:`<p class="muted">The Start button appears when your friend joins.</p>`):`<p class="muted" style="font-size:18px">Waiting for ${esc(d.players[0].name)} to start the race…</p>`}</div>`}
 if(G.stage==='count'||G.stage==='go-wait')return head+fLanesHTML()+`<div class="panel gend"><p style="font-size:22px">Get ready…</p><div class="fcode" id="fcount">${Math.max(1,Math.ceil((G.startAt-performance.now())/1000))}</div></div>`;
 if(G.stage==='race'){const me=d.players.find(p=>p.me)||{pos:0};const w=G.list[G.i];
  return head+`<p class="muted" style="text-align:center">${d.goal-me.pos} words to the finish!</p>`+fLanesHTML()+
  (me.pos>=d.goal?`<div class="panel gend"><p style="font-size:22px">You crossed the finish line! 🏁 Checking who was first…</p></div>`:`<div class="panel">${gAsk()}</div>`)}
 const me=d.players.find(p=>p.me);const won=me&&me.done&&d.winner===ME.first_name;
 return head+fLanesHTML()+(won?`<div class="panel gend"><div style="font-size:90px">🏆</div><h2 class="f" style="font-size:34px">You won the race!</h2><p style="font-size:20px">Super fast spelling, ${esc(ME.first_name)}!</p>`
  :`<div class="panel gend"><div style="font-size:80px">🐝💨</div><h2 class="f" style="font-size:32px">${esc(d.winner||'Your friend')} won this time!</h2><p style="font-size:20px">You spelt ${me?me.pos:0} words. Great racing! Practise and race again!</p>`)+
  `<div class="row" style="margin-top:14px"><button class="y" data-g="gfriend">New race 🔁</button><button class="w" data-g="menu">More games</button></div></div>`}
async function fCreate(){G.stage='busy';G.err='';render();fApply(await fCall('race_create'))}
async function fJoin(){const v=($('#fjoin')?.value||'').trim();G.join=v;if(!v){G.err='Type the race code first.';render();return}G.stage='busy';G.err='';render();fApply(await fCall('race_join',{p_race:v}))}
async function fStart(){const d=await fCall('race_start',{p_race:G.code});fApply(d)}
function fCheck(){const v=readAns();if(!v||G.fb||G.stage!=='race')return;const w=G.list[G.i];const ok=same(v,w);G.val=v;award(V.team,w,ok);const me=G.data.players.find(p=>p.me);
 if(ok){G.myPos=(G.myPos||0)+1;me.pos=G.myPos;G.fb='ok';const pos=me.pos;render();gGood();fCall('race_move',{p_race:G.code,p_pos:pos}).then(fApply);
  if(pos>=G.data.goal)return;gAfterTalk(()=>{G.i++;G.val='';G.fb=null;render();setTimeout(()=>sayWordSentence(G.list[G.i]),150)},900)}
 else{G.fb='bad';render();oops()}}
function fNext(){if(G.stage!=='race')return;G.i++;G.val='';G.fb=null;render();setTimeout(()=>sayWordSentence(G.list[G.i]),150)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b||!G||G.kind!=='gfriend')return;const f=b.dataset.f;
 if(f==='create')fCreate();if(f==='join')fJoin();if(f==='start'){b.disabled=true;fStart()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='fjoin'){e.preventDefault();fJoin()}});
document.addEventListener('input',e=>{if(e.target.id==='fjoin'&&G)G.join=e.target.value});

async function submitCode(){const i=$('#codein'),m=$('#codemsg');if(!i)return;const btn=document.querySelector('[data-code]');
 if(btn){btn.disabled=true;btn.textContent='Checking… 🐝'}const r=await loginCode(i.value);
 if(r.ok){V={screen:'team',team:ME.team};render();window.scrollTo(0,0);happySound(false);setTimeout(()=>say("Hello! Let's practise your spellings!"),300);flush()}
 else{if(btn){btn.disabled=false;btn.textContent='Let’s go! 🐝'}if(m){m.textContent=r.err;m.classList.add('show')}gentleSound()}}
document.addEventListener('submit',e=>{if(e.target.id==='codeform'){e.preventDefault();submitCode()}});
/* spelling lists come from the teachers' Word lists (database); built-in lists are the backup */
const WKEY='aa-sbee-words';
function applyRows(rows){if(!Array.isArray(rows)||!rows.length)return false;const nw={buz:[],hon:[],bum:[],cha:[]};
 rows.forEach(r=>{if(nw[r.team]&&r.word)nw[r.team].push(r.word)});for(const t in nw)if(nw[t].length)WORDS[t]=nw[t];
 for(const k in SENT)delete SENT[k];rows.forEach(r=>{if(r.sentence)SENT[r.word]=r.sentence});
 DBROWS=rows;for(const k in CLIP)delete CLIP[k];buildClips();return true}
try{applyRows(JSON.parse(localStorage.getItem(WKEY)||'null'))}catch(e){}
async function loadWords(){const c=db();if(!c)return;try{const {data,error}=await c.rpc('public_words');if(error||!Array.isArray(data)||!data.length)return;
 const slim=data.map(r=>({team:r.team,word:r.word,sentence:r.sentence,w_clip:r.w_clip,s_clip:r.s_clip,ws_clip:r.ws_clip}));
 const changed=JSON.stringify(slim)!==JSON.stringify(DBROWS);applyRows(slim);try{localStorage.setItem(WKEY,JSON.stringify(slim))}catch(e){}
 if(changed&&['home','team','learn'].includes(V.screen))render()}catch(e){}}
buildClips();
render();
loadWords();
if(ME){refreshMe();flush()}
(async()=>{try{tts=await window.claude?.use?.('tts')}catch(e){}})();
})();
</script>
