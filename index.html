<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Spelling Bee — for primary schools</title>
<meta name="description" content="A fun Spelling Bee for primary schools: practice, games, avatars and streaks for children, plus class rounds, a Grand Final screen, certificates and reports for teachers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--aa:#1B3A6B;--aa2:#D62839;--honey:#F5B700;--honey2:#FFD54A;--honeyL:#FFF3C4;--ink:#1F2A44;--ink2:#46506B;--bg:#FFFBEF;--line:#F1E7C8;--ok:#1E9E5A;--okL:#E3F6EA;--bad:#D64545;--badL:#FDE8E8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:19px;border:0;border-radius:18px;padding:13px 22px;cursor:pointer;background:var(--aa);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .06s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.y{background:var(--honey);color:var(--ink)}button.w{background:#fff;color:var(--aa);border:2px solid var(--line)}button.r{background:var(--aa2)}button.g{background:var(--ok)}
button:disabled{opacity:.45}
.top{background:var(--aa);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.top .t{font-family:Fredoka;font-size:20px}.top .s{font-size:13px;opacity:.75}
.top .stars{margin-left:auto;background:rgba(255,255,255,.14);padding:7px 14px;border-radius:999px;font-family:Fredoka;font-size:18px}
.top button{font-size:15px;padding:8px 14px;border-radius:12px;box-shadow:none;background:rgba(255,255,255,.15)}
main{max-width:980px;margin:0 auto;padding:20px 18px 50px}
.hero{position:relative;overflow:hidden;background:var(--aa);color:#fff;text-align:center;padding:34px 20px 54px;border-radius:0 0 38px 38px}
.hero h1{font-size:clamp(40px,8vw,80px);color:var(--honey2);line-height:1;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.hero h1 small{display:block;font-size:.45em;color:#fff;margin-bottom:6px}
.hero p{font-family:Fredoka;font-size:clamp(18px,3vw,26px);margin:12px 0 0}
.combs{position:absolute;inset:0;opacity:.13;pointer-events:none}
.flybee{position:absolute;width:76px;height:76px;animation:fly 10s ease-in-out infinite}
@keyframes fly{0%{left:5%;top:60%}25%{left:35%;top:8%;transform:rotate(8deg)}50%{left:84%;top:35%;transform:scaleX(-1)}75%{left:58%;top:70%;transform:scaleX(-1) rotate(6deg)}100%{left:5%;top:60%}}
.wing{animation:flap .18s ease-in-out infinite alternate;transform-origin:center bottom}@keyframes flap{to{transform:scaleY(.55)}}
.h2{text-align:center;font-size:clamp(26px,4vw,36px);margin:28px 0 16px}
.teams{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.team{border-radius:28px;padding:22px 16px;text-align:center;cursor:pointer;border:4px solid transparent;transition:transform .12s;background:#fff}
.team:hover{transform:translateY(-4px) rotate(-1deg)}
.team .e{font-size:62px;line-height:1}.team h3{font-size:25px;margin-top:8px}.team .gr{font-weight:800;opacity:.7}
.buz{background:#FFE8F1;border-color:#F9A8D4}.hon{background:#FFF4CC;border-color:#FFD54A}.bum{background:#E0ECFF;border-color:#93C5FD}.cha{background:#EFE7FF;border-color:#C4B5FD}
.act.games{background:linear-gradient(135deg,#FFF3C4,#FFE7A0);border-color:var(--honey)}
.act.game{position:relative}.gwon{margin-top:10px;font-family:Fredoka;font-size:16px;color:#8A5A00;background:var(--honeyL);display:inline-block;padding:4px 12px;border-radius:99px}
.gend{text-align:center;margin-top:16px}.gend h2{margin:6px 0}
.hive{position:relative;margin:8px 0 18px;padding:34px 10px 6px;background:linear-gradient(#EAF6FF,#FFFBEF);border-radius:24px;border:3px solid var(--line)}
.stops{display:flex;justify-content:space-between;align-items:flex-end}.stop{font-size:clamp(22px,4.5vw,38px);flex:1;text-align:center;transition:transform .3s}.stop.past{opacity:.8}.stop.home{font-size:clamp(34px,7vw,56px)}
.flyer{position:absolute;top:0;font-size:clamp(28px,5vw,44px);transform:translateX(-50%);transition:left 1s cubic-bezier(.5,-0.3,.4,1.4)}
.buzz{animation:buzz .5s}@keyframes buzz{0%,100%{translate:0}20%{translate:-8px}40%{translate:8px}60%{translate:-6px}80%{translate:6px}}
.gkey{text-align:center;color:var(--ink2);font-size:15px;margin:6px 0 10px}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;background:#E9DCC0;padding:12px;border-radius:22px;border:3px solid #D9C69C}
.plot{background:#B9935A;border-radius:14px;text-align:center;padding:6px 4px;cursor:pointer;color:#fff}.plot span{font-size:34px;display:block;line-height:1.2}.plot small{font-size:12px;font-weight:700;word-break:break-word}
.plot.secure{background:#7CC47F}.plot.almost{background:#A58B57}.plot.tricky{background:#9C7A47}
.plot.grow span{animation:grow .9s}@keyframes grow{0%{transform:scale(.2)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.race{margin:8px 0 18px;display:flex;flex-direction:column;gap:8px}
.lane{position:relative;height:64px;border-radius:18px;background:repeating-linear-gradient(90deg,#FFF3C4 0 40px,#FFE9A3 40px 80px);border:3px solid var(--line);overflow:hidden}
.lane.them{background:repeating-linear-gradient(90deg,#E3EFFF 0 40px,#D2E4FF 40px 80px)}
.lane .who{position:absolute;left:10px;top:2px;font-family:Fredoka;font-size:13px;color:var(--ink2)}
.runner{position:absolute;top:14px;font-size:38px;transition:left .8s ease-out;transform:scaleX(-1)}.runner.opp{filter:hue-rotate(180deg) saturate(1.6);transition:none}
.flag{position:absolute;right:8px;top:12px;font-size:34px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}.slots span{width:clamp(30px,6vw,46px);height:clamp(40px,8vw,56px);border-bottom:5px solid var(--honey);font-family:Fredoka;font-size:clamp(24px,5vw,36px);display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px 10px 0 0}.slots span.in{background:var(--okL);border-color:var(--ok)}
.sky{position:relative;height:min(420px,58vh);border-radius:24px;overflow:hidden;background:linear-gradient(#BFE3FF,#EAF6FF 70%,#CDEBB5 70%);border:3px solid var(--line);touch-action:manipulation}
.lanehit{position:absolute;top:0;bottom:0;width:25%;cursor:pointer}.lanehit:nth-child(1){left:0}.lanehit:nth-child(2){left:25%}.lanehit:nth-child(3){left:50%}.lanehit:nth-child(4){left:75%}
.drop{position:absolute;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:#fff;border:4px solid var(--honey);font-family:Fredoka;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.08);pointer-events:none}
.jar{position:absolute;bottom:10px;font-size:58px;transform:translateX(-50%);transition:left .18s;pointer-events:none}
.jar.yum{animation:yum .4s}@keyframes yum{50%{transform:translateX(-50%) scale(1.3)}}
.jar.buzz{animation:jbuzz .5s}@keyframes jbuzz{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-62%)}75%{transform:translateX(-38%)}}
button.mv{font-size:28px;padding:10px 34px}
.bscene{position:relative;height:230px;margin:6px auto 0;max-width:420px}
.bset{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;gap:2px}
.bl{font-size:46px;display:inline-block;transform:rotate(var(--r));transform-origin:50% 140%;transition:opacity .3s,transform .3s;animation:bob 2.6s ease-in-out infinite}
.bl:nth-child(even){animation-delay:.6s}.bl.gone{opacity:0;transform:scale(.2)}
.bl.popping{animation:pop .35s forwards}@keyframes pop{0%{opacity:1;transform:scale(1)}60%{transform:scale(1.5)}100%{opacity:0;transform:scale(.1)}}
@keyframes bob{50%{translate:0 -6px}}
.bstrings{position:absolute;left:50%;top:62px;width:2px;height:90px;background:#9AA4B8;transform:translateX(-50%)}
.bbee{position:absolute;left:50%;top:140px;font-size:64px;transform:translateX(-50%);animation:bob 2.6s ease-in-out infinite}
.bbee.fall{animation:none;top:160px;transform:translateX(-50%) rotate(20deg);transition:top .6s}
.kb.hm button.good{background:var(--okL);border-color:#A7E3BF;color:#166534}.kb.hm button.bad{background:#EEE;color:#AAA;text-decoration:line-through}
.kb.hm button:disabled{cursor:default}
.slots span.miss{background:var(--badL);border-color:var(--bad);color:var(--bad)}
.fgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}.fgrid .panel{text-align:center}
.fcode{font-family:Fredoka;font-size:clamp(54px,12vw,92px);letter-spacing:.08em;color:var(--aa);margin:4px 0 10px}
.fplayers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}.fplayers span{font-family:Fredoka;font-size:20px;background:var(--honeyL);border:3px solid var(--honey);padding:8px 16px;border-radius:99px}
.fplayers .fwait{background:#fff;border-style:dashed;color:var(--ink2);animation:bob 1.6s infinite}
.lane.me{box-shadow:0 0 0 3px var(--honey)}
.speeds{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:0 0 10px;font-family:Fredoka;font-size:18px;color:var(--ink2)}
.speeds button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:8px 16px;font-size:18px;box-shadow:none}.speeds button.on{background:var(--honey);border-color:var(--honey)}
.lb{margin-top:18px;text-align:center}.lbtabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.lbtabs button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:8px 14px;font-size:16px;box-shadow:none}.lbtabs button.on{background:var(--honey);border-color:var(--honey)}
.lbl{list-style:none;padding:0;margin:0 auto;max-width:520px;text-align:left}.lbl li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;font-family:Fredoka;font-size:20px}
.lbl li:nth-child(odd){background:#FFFBEF}.lbl li.me{background:var(--honeyL);box-shadow:inset 0 0 0 3px var(--honey)}
.lbm{width:36px;text-align:center;font-size:24px}.lbn{flex:1}.lbw{color:var(--ink2);font-size:17px}
.top .topav,.topav{background:none;border:0;padding:0;margin-left:auto;box-shadow:none;border-radius:50%;line-height:0}.topav svg{border-radius:50%;border:3px solid var(--honey);background:#fff}
.topav+.stars{margin-left:10px}
.act.shop{background:linear-gradient(135deg,#FDE8F3,#FFF3C4);border-color:#F4A6C4}.avact{display:flex;justify-content:center}.avact svg{border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.avbanner{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#FFF3C4,#FDE8F3);border:3px solid var(--honey);border-radius:24px;padding:14px 18px;margin-bottom:18px;cursor:pointer;flex-wrap:wrap}.avbanner>div{flex:1;min-width:200px}
.avwrap{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:14px;align-items:start}@media(max-width:760px){.avwrap{grid-template-columns:1fr}}
.avstage{background:#fff;border:3px solid var(--line);border-radius:28px;padding:18px;text-align:center;position:sticky;top:10px}.avbig svg{border-radius:50%;border:5px solid var(--honey);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.avbal{display:inline-block;margin-top:8px;background:var(--honey);font-family:Fredoka;font-size:22px;padding:6px 16px;border-radius:99px}
.avtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.avtabs button{background:#fff;color:var(--ink);border:3px solid var(--line);padding:8px 14px;font-size:17px;box-shadow:none}.avtabs button.on{background:var(--honey);border-color:var(--honey)}
.avsec{text-align:left;margin-bottom:12px;padding:16px}.avsec h3{font-size:20px;margin:0 0 10px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.avopt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);box-shadow:none;font-size:13px;position:relative}
.avopt svg{border-radius:50%}.avopt.on{border-color:var(--honey);background:var(--honeyL);box-shadow:0 0 0 3px var(--honey)}
.avopt.locked svg{filter:saturate(.55);opacity:.85}.avn{font-weight:700;font-size:13px;line-height:1.1}
.avprice{background:var(--aa);color:#fff;border-radius:99px;padding:2px 8px;font-size:12.5px;font-weight:800}.avown{color:var(--ok);font-size:12px;font-weight:800}
.swatch{width:48px;height:48px;border-radius:50%;border:3px solid rgba(0,0,0,.08);display:block}
.buybox{text-align:center}.buybox svg{border-radius:50%;border:4px solid var(--honey)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;color:var(--ink);box-shadow:none;text-align:left;font-size:15px}.pitem svg{border-radius:50%;flex:none}
.pitem .pn{flex:1;font-weight:700}.pitem .pp{font-family:Fredoka;white-space:nowrap}.pitem.own{background:var(--okL)}
.lane .who svg,.lbl li svg{vertical-align:middle;border-radius:50%}.lbl li svg{flex:none}
.act.realbee{background:linear-gradient(135deg,#E8F0FF,#FFF3C4);border-color:#93B4F0}
.rbtop{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka;font-size:22px;margin:4px 4px 12px}
.rbtimer{background:#fff;border:3px solid var(--line);border-radius:99px;padding:4px 14px}.rbtimer.low{color:var(--bad);border-color:var(--bad);animation:spop 1s infinite}
.rbrule{background:#E8F0FF;border-radius:14px;padding:10px 14px;color:#1E3A8A;font-size:16px}
.rbmean{background:var(--honeyL);border-radius:14px;padding:10px 14px;margin-top:12px;font-size:19px;font-weight:700}
.rbtiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:64px;margin:18px 0 6px}
.rbtiles span{width:clamp(36px,7vw,52px);height:clamp(48px,9vw,62px);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-size:clamp(26px,5vw,36px);background:#fff;border:3px solid var(--honey);border-radius:12px;animation:pop .25s}
.rbtiles span.cur{border-style:dashed;border-color:var(--line);animation:bob 1.2s infinite}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.tcard{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:14px 18px}
.tcard>div:nth-child(2){flex:1}.flame{font-size:46px;line-height:1;animation:bob 2s infinite}.flame.off{filter:grayscale(1);opacity:.5;animation:none}
.streakc{background:linear-gradient(135deg,#FFF1E0,#FFE3C2);border-color:#FBC38A}
.wodc{background:linear-gradient(135deg,#FFF8D6,#FFEFA8);border-color:var(--honey);cursor:pointer}.wodc.done{cursor:default;background:var(--okL);border-color:#A7E3BF}
.flamechip+.stars{margin-left:10px}
.flamechip{margin-left:10px!important;background:rgba(255,160,60,.25)!important}
.streakc{grid-column:1/-1;flex-direction:column;align-items:stretch;gap:12px}.streakc.lit{background:linear-gradient(135deg,#FFE9C7,#FFD39A);border-color:#F59E0B}
.sk-top{display:flex;align-items:center;gap:16px}.sk-top .flame{filter:drop-shadow(0 0 10px rgba(255,140,0,.45))}.sk-top .flame.off{filter:grayscale(1)}
.best{display:inline-block;background:#fff;border-radius:99px;padding:1px 10px;font-weight:800;color:#B45309;margin-left:4px}
.ring{position:relative;width:78px;height:96px;text-align:center;flex:none}.ringt{position:absolute;top:24px;left:0;right:0;font-family:Fredoka;font-size:18px}.ringl{font-size:12px;font-weight:800;color:var(--ink2);margin-top:-4px}
.sk-bottom{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.weekrow{display:flex;gap:6px;align-items:flex-start}.wd{width:40px;display:flex;flex-direction:column;align-items:center}.today .wodc{grid-column:1/-1}.wd span{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #F8DDBF;font-size:20px}
.wd.on span{background:#FFF3C4;border-color:#F59E0B}.wd.tdy span{box-shadow:0 0 0 3px #1B3A6B}.wd.we span{background:#FFF8EF;border-style:dashed;font-size:16px}.wd.fut span{opacity:.5}
.wd i{display:block;font-style:normal;font-weight:800;font-size:12px;color:var(--ink2);margin-top:2px}
.nextg{flex:1;min-width:220px;font-size:16px}.nbar{height:12px;background:#fff;border-radius:99px;overflow:hidden;margin-top:6px;border:2px solid #F8DDBF}.nbar i{display:block;height:100%;background:linear-gradient(90deg,#FBBF24,#F59E0B);border-radius:99px}
.avparade{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 18px}.avparade span{animation:bob 2.4s ease-in-out infinite;line-height:0}.avparade svg{border-radius:50%;border:4px solid #fff;box-shadow:0 6px 16px rgba(31,42,68,.12)}
.funs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:900px){.funs{grid-template-columns:1fr 1fr}}@media(max-width:520px){.funs{grid-template-columns:1fr}}.fun{background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px 18px}.fun .e{font-size:40px}.fun b{font-family:Fredoka;font-size:21px;display:block;margin:4px 0}.fun p{margin:0;color:var(--ink2);font-size:15.5px}
.herologo{display:inline-flex;background:#fff;border-radius:16px;padding:8px 14px;margin-bottom:10px}.herologo img{max-height:64px;max-width:220px;object-fit:contain}

.hsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.hstep{background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px}.hstep span{display:inline-flex;width:40px;height:40px;border-radius:50%;background:var(--honey);align-items:center;justify-content:center;font-family:Fredoka;font-size:22px}.hstep b{display:block;font-family:Fredoka;font-size:21px;margin:8px 0 4px}.hstep p{margin:0;color:var(--ink2)}
.pplans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}.pplan{position:relative;background:#fff;border:3px solid var(--line);border-radius:26px;padding:22px}.pplan.pbest{border-color:var(--honey);box-shadow:0 10px 30px rgba(245,183,0,.25)}

.act .e{font-size:54px}.act h3{font-size:24px;margin:6px 0}.act p{margin:0;color:var(--ink2);font-size:15.5px}
.panel{background:#fff;border-radius:28px;padding:24px;border:3px solid var(--line);text-align:center}

.ans{font-family:Fredoka;font-size:clamp(28px,6vw,42px);text-align:center;letter-spacing:.08em;width:100%;max-width:520px;padding:12px 16px;border:4px solid var(--honey);border-radius:20px;background:var(--honeyL);color:var(--ink);outline:none}

let LC=null;

 else if(LC.step===2)body=`<div class="big">🙈</div><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="write it here" value="${esc(LC.val)}">${kb()}<div class="row" style="margin-top:16px"><button class="w" data-say="${esc(LC.w)}">🔊 Hear it</button><button class="y" data-lc="check">Check ✔</button></div>`;

function newMiss(){const t=T(V.team);const ws=WORDS[t.id].filter(w=>w.length>=3);const w=pick(ws);const idxs=shuffle([...w].map((c,i)=>i)).slice(0,Math.min(t.blanks,Math.max(1,w.length-2))).sort((a,b)=>a-b);
 const need=idxs.map(i=>w[i].toLowerCase());const letters='abcdefghijklmnopqrstuvwxyz';const extra=shuffle([...letters].filter(c=>!need.includes(c))).slice(0,Math.max(3,6-need.length));
 MS={w,idxs,fill:[],tiles:shuffle(need.concat(extra)),fb:null}}
/* ---------- Fill the gap ---------- */

function gapWords(){return WORDS[V.team].filter(w=>SENT[w]&&new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(SENT[w]))}
function newGap(){const p=prog(V.team);const ws=shuffle(gapWords());const fresh=ws.filter(w=>wordLevel(V.team,w)!=='secure');const list=(fresh.length>=10?fresh:fresh.concat(ws.filter(w=>!fresh.includes(w)))).slice(0,10);GP={list,i:0,val:'',fb:null,score:0,missed:[],done:false}}

 const i=m.index;return esc(s.slice(0,i))+(reveal?`<span class="gapw ${GP&&GP.fb==='ok'?'ok':'bad'}">${esc(m[1])}</span>`:'<span class="gapb">?</span>')+esc(s.slice(i+m[1].length))}

 ${TS.missed.length?`<p class="muted">Practise these words again:</p><div class="wordgrid" style="max-width:640px;margin:0 auto">${TS.missed.map(w=>`<div class="wc" data-say="${esc(w)}">🔊 ${esc(w)}</div>`).join('')}</div>`:''}

/* 6. Race a friend (online, with a race code) */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fWords(team,seed,n){const r=mulberry(seed);const a=WORDS[team].slice().sort();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const out=[];while(out.length<n&&a.length)out.push(a[out.length%a.length]);return out}
let FPOLL=null,FBUSY=false;
function fErr(e){return ({code:'Your bee code didn’t work. Ask your teacher.',notfound:'We couldn’t find that race code. Check it and try again!',started:'That race has already started. Ask your friend for a new code.',full:'That race is full (6 bees max).',notin:'You are not in this race.',net:'We couldn’t connect. Check the internet and try again.'})[e]||(e==='team'?'':'Something went wrong. Try again.')}
async function fCall(fn,args){const c=db();if(!c)return {error:'net'};try{const {data,error}=await c.rpc(fn,Object.assign({p_code:ME.code},args||{}));if(error||!data)return {error:'net'};return data}catch(e){return {error:'net'}}}

 const was=G.stage;G.data=d;G.code=d.code;{const m=d.players.find(p=>p.me);if(m&&(G.myPos||0)>m.pos)m.pos=G.myPos}
 if(!G.list)G.list=fWords(d.team,d.seed,d.goal+40);
 if(d.status==='wait'){G.stage='wait';if(was!=='wait'||G.nPl!==d.players.length){G.nPl=d.players.length;render();if(was==='wait')happySound(false)}fStartPoll();return}
 if(d.status==='go'&&d.starts_in>0&&was!=='race'){G.stage='count';G.startAt=performance.now()+d.starts_in*1000;if(was!=='count')render();fStartPoll();return}
 if(d.status==='go'){if(was!=='race'){G.stage='race';G.i=0;G.val='';G.fb=null;render();setTimeout(()=>sayWordSentence(G.list[0]),150)}else fLanes();fStartPoll();return}

/* ---------- 🔥 streak + 🌟 word of the day ---------- */
function dayIndex(){return Math.round((Date.parse(dubaiDay())-Date.parse('2026-01-01'))/864e5)}
function yesterday(){return new Date(Date.parse(dubaiDay())-864e5).toISOString().slice(0,10)}
function wordOfDay(team){const ws=WORDS[team]||[];return ws.length?ws[(dayIndex()*37)%ws.length]:null}
function goalFor(team){return team==='buz'||team==='hon'?5:10}
function prevSchoolDay(ds){const d=new Date(ds+'T12:00:00Z');const dow=d.getUTCDay();const back=dow===1?3:dow===0?2:1;return new Date(d.getTime()-back*864e5).toISOString().slice(0,10)}
function streakNow(team){const p=prog(team);if(!p.streakDay)return 0;return p.streakDay>=prevSchoolDay(dubaiDay())?(p.streak||0):0}
const MILESTONES=[[3,5],[7,15],[14,30],[30,60]];
function bumpStreak(p,team){const td=dubaiDay();if(p.dayDay!==td){p.dayDay=td;p.dayCount=0}p.dayCount=(p.dayCount||0)+1;
 if(p.dayCount<goalFor(team)||p.streakDay===td)return;
 p.streak=(p.streakDay&&p.streakDay>=prevSchoolDay(td))?(p.streak||0)+1:1;p.streakDay=td;p.bestStreak=Math.max(p.bestStreak||0,p.streak);
 p.sDays=[...new Set([...(p.sDays||[]),td])].filter(d=>d>new Date(Date.parse(td)-21*864e5).toISOString().slice(0,10)).sort();
 const m=MILESTONES.find(x=>x[0]===p.streak);if(m)p.stars+=m[1];
 setTimeout(()=>{burst();happySound(true);setTimeout(()=>clapSound(true),120);note(m?`🔥 ${p.streak}-day streak! You won ${m[1]} bonus stars! ⭐`:`🔥 Today’s flame is lit! ${p.streak}-day streak!`);praise(pick(CHEERS)[1],true)},2600)}
function flameBadge(n){return n>=30?'👑':n>=14?'🏅':n>=7?'🌟':'🔥'}
function todayPanel(t){const p=prog(t.id),td=dubaiDay(),st=streakNow(t.id),goal=goalFor(t.id),dc=p.dayDay===td?(p.dayCount||0):0,lit=p.streakDay===td;
 const wod=wordOfDay(t.id),done=p.dailyDay===td;
 const now=new Date(td+'T12:00:00Z');const dow=(now.getUTCDay()+6)%7;const mon=new Date(now.getTime()-dow*864e5);
 const week=[...Array(7)].map((_,i)=>{const d=new Date(mon.getTime()+i*864e5).toISOString().slice(0,10);return {d,lab:['M','T','W','T','F','S','S'][i],we:i>=5,on:(p.sDays||[]).includes(d)||(d===p.streakDay&&lit),today:d===td,future:d>td}});
 const next=MILESTONES.find(m=>m[0]>st);const left=next?next[0]-st:0;
 const r=26,C=2*Math.PI*r,frac=Math.min(1,dc/goal);
 const size=Math.min(96,48+st*2.2);
 return `<div class="today">
  <div class="tcard streakc ${lit?'lit':''}">
   <div class="sk-top"><div class="flame ${st||lit?'':'off'}" style="font-size:${size}px">${st?flameBadge(st):'🔥'}</div>
    <div style="flex:1"><div class="f" style="font-size:26px">${st?`${st}-day streak!`:'Light your flame!'}</div>
     <div class="muted">${lit?'✅ Today’s flame is lit! Come back tomorrow to keep it growing.':`Practise <b>${goal} words</b> today to ${st?'keep your streak going':'start a streak'}.`}${(p.bestStreak||0)>1?` <span class="best">Best: ${p.bestStreak} days</span>`:''}</div></div>
    <div class="ring" title="${dc} of ${goal} words today"><svg viewBox="0 0 64 64" width="78" height="78"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#F8DDBF" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${lit?'#1E9E5A':'#F59E0B'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg><div class="ringt">${lit?'✅':`<b>${Math.min(dc,goal)}</b>/${goal}`}</div><div class="ringl">words today</div></div></div>
   <div class="sk-bottom"><div class="weekrow">${week.map(x=>`<div class="wd ${x.on?'on':''} ${x.today?'tdy':''} ${x.we?'we':''} ${x.future?'fut':''}"><span>${x.on?'🔥':x.we?'🛋️':''}</span><i>${x.lab}</i></div>`).join('')}</div>
    <div class="nextg">${next?`<div><b>${flameBadge(next[0])} ${left} more day${left===1?'':'s'}</b> to your ${next[0]}-day badge <b>(+${next[1]} ⭐)</b></div><div class="nbar"><i style="width:${Math.round(st/next[0]*100)}%"></i></div>`:`<div><b>👑 Streak legend!</b> You’ve reached every badge!</div>`}
     <div class="small muted" style="margin-top:4px">🛋️ Weekends never break your streak.</div></div></div>
  </div>
  ${wod?`<div class="tcard wodc ${done?'done':''}" ${done?'':'data-go="wod"'}><div class="flame">🌟</div><div><div class="f" style="font-size:24px">Word of the day</div>
   <div class="muted">${done?'✅ You spelt today’s word! New word tomorrow.':'Spell today’s special word for <b>+5 ⭐</b>!'}</div></div>${done?'':'<button class="y">Let’s go →</button>'}</div>`:''}
 </div>`}
let WD=null;
function wodView(){const t=T(V.team);const w=wordOfDay(t.id);if(!WD||WD.w!==w)WD={w,val:'',tries:0,fb:null};const p=prog(t.id);const done=p.dailyDay===dubaiDay();
 return `<div class="row" style="justify-content:space-between"><button class="back" data-go="team">← Back</button><div class="f" style="font-size:22px">🌟 Word of the day</div></div>
 <div class="panel">${done&&WD.fb!=='ok'?`<p style="font-size:20px">✅ You already spelt today’s word. Come back tomorrow for a new one!</p>`:`
  <div style="font-size:60px">🌟</div><p class="muted" style="font-size:17px">Listen carefully, then spell it for <b>+5 ⭐</b>. You have 3 tries.</p>
  <div class="row"><button class="y hear" data-sayw="${esc(w)}">🔊 Hear the word</button>${SENT[w]?`<button class="w" data-say="${esc(SENT[w])}">💬 Sentence</button>`:''}${MEAN[w]?`<button class="w" data-say="${esc(MEAN[w])}">📖 Meaning</button>`:''}</div>
  <div style="margin-top:16px"><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="spell it here" value="${esc(WD.val)}" ${WD.fb==='ok'||WD.fb==='gone'?'disabled':''}></div>
  ${WD.fb==='ok'?`<div class="fb ok">Brilliant! You won 5 bonus stars! ⭐⭐⭐⭐⭐</div><div class="row" style="margin-top:12px"><button class="y" data-go="team">Back to my practice →</button></div>`
  :WD.fb==='gone'?`<div class="fb bad">Good try! It’s spelt <u>${esc(w)}</u>. Practise it and try a new word tomorrow! 💛</div><div class="row" style="margin-top:12px"><button class="y" data-go="team">Back →</button></div>`
  :`${WD.fb==='bad'?`<div class="fb bad">Not quite! ${3-WD.tries} ${3-WD.tries===1?'try':'tries'} left. Listen again. 👂</div>`:''}${kb()}<div class="row" style="margin-top:14px"><button class="y" data-wd="check">Check ✔</button></div>`}`}</div>`}
async function wodCheck(){const v=readAns();if(!v||!WD||WD.fb==='ok'||WD.fb==='gone')return;WD.val=v;const w=WD.w;const ok=same(v,w);award(V.team,w,ok);
 if(ok){WD.fb='ok';const p=prog(V.team);p.dailyDay=dubaiDay();p.stars+=5;savePR();render();burst();happySound(true);setTimeout(()=>clapSound(true),120);setTimeout(()=>praise(pick(CHEERS)[1],true),400);
  const c=db();if(c&&ME){try{const {data}=await c.rpc('daily_bonus',{p_code:ME.code,p_word:w});if(data&&typeof data.stars==='number'){p.stars=Math.max(p.stars,data.stars);savePR();const s=document.querySelector('.top .stars');if(s)s.textContent='⭐ '+totalStars()}}catch(e){}}}
 else{WD.tries++;WD.val='';WD.fb=WD.tries>=3?'gone':'bad';render();oops();if(WD.fb==='bad')setTimeout(()=>say(w),2400)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-wd]');if(b&&V.screen==='wod')wodCheck()});
document.addEventListener('keydown',e=>{if(V.screen==='wod'&&e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();wodCheck()}});

async function submitCode(){const i=$('#codein'),m=$('#codemsg');if(!i)return;const btn=document.querySelector('[data-code]');
 if(btn){btn.disabled=true;btn.textContent='Checking… 🐝'}const r=await loginCode(i.value);
 if(r.ok){loadWords();V={screen:'team',team:ME.team};render();window.scrollTo(0,0);happySound(false);setTimeout(()=>say("Hello! Let's practise your spellings!"),300);flush()}
 else{if(btn){btn.disabled=false;btn.textContent='Let’s go! 🐝'}if(m){m.textContent=r.err;m.classList.add('show')}gentleSound()}}
document.addEventListener('submit',e=>{if(e.target.id==='codeform'){e.preventDefault();submitCode()}});
/* spelling lists come from the teachers' Word lists (database); built-in lists are the backup */
const WKEY='aa-sbee-words';
function applyRows(rows){if(!Array.isArray(rows)||!rows.length)return false;const nw={buz:[],hon:[],bum:[],cha:[]};
 rows.forEach(r=>{if(nw[r.team]&&r.word)nw[r.team].push(r.word)});for(const t in nw)if(nw[t].length)WORDS[t]=nw[t];
 for(const k in SENT)delete SENT[k];rows.forEach(r=>{if(r.sentence)SENT[r.word]=r.sentence});for(const k in MEAN)delete MEAN[k];rows.forEach(r=>{if(r.meaning)MEAN[r.word]=r.meaning});
 DBROWS=rows;for(const k in CLIP)delete CLIP[k];buildClips();return true}
try{applyRows(JSON.parse(localStorage.getItem(WKEY)||'null'))}catch(e){}
async function loadWords(){const c=db();if(!c||!ME)return;try{const {data,error}=await c.rpc('school_words',{p_code:ME.code});if(error||!Array.isArray(data)||!data.length)return;
 const slim=data.map(r=>({team:r.team,word:r.word,sentence:r.sentence,w_clip:r.w_clip,s_clip:r.s_clip,ws_clip:r.ws_clip,meaning:r.meaning||'',m_clip:r.m_clip||''}));
 const changed=JSON.stringify(slim)!==JSON.stringify(DBROWS);applyRows(slim);try{localStorage.setItem(WKEY,JSON.stringify(slim))}catch(e){}
 if(changed&&['home','team','learn'].includes(V.screen))render()}catch(e){}}
/* how Kate reads: fast, slow or very slow (saved on this device) */
document.addEventListener('click',e=>{const b=e.target.closest('[data-kspd]');if(!b)return;e.preventDefault();e.stopPropagation();
 const ov=document.createElement('div');ov.className='kspov';const cur=kSpeed();
 ov.innerHTML=`<div class="kspcard"><div style="display:flex;align-items:center"><b style="font-family:Fredoka,Arial;font-size:24px;color:#1F2A44;flex:1">How Kate reads</b><button class="ksp" data-kx="1" style="flex:0;padding:6px 12px">✕</button></div><div style="color:#6B7280;font-weight:700;margin-top:4px">Choose how fast Kate speaks.</div><div class="ksprow">${[['fast','🐇 Fast'],['slow','🐢 Slow'],['vslow','🐌 Very slow']].map(([k,l])=>`<button class="ksp ${cur===k?'on':''}" data-kv="${k}">${l}</button>`).join('')}</div></div>`;
 document.body.appendChild(ov);
 ov.addEventListener('click',ev=>{if(ev.target===ov||ev.target.closest('[data-kx]')){ov.remove();try{render()}catch(err){}return}const o=ev.target.closest('[data-kv]');if(!o)return;
  try{localStorage.setItem('kate-speed',o.dataset.kv)}catch(err){}ov.querySelectorAll('[data-kv]').forEach(x=>x.classList.toggle('on',x===o));say('Hello! This is how I will read your words.')})},true);
buildClips();
render();
loadWords();loadSchoolPage();
if(ME){refreshMe();flush()}
(async()=>{try{tts=await window.claude?.use?.('tts')}catch(e){}})();
})();
</script>
</body>
