/* resize a logo so it is small enough to save (max 480px, keeps transparency) */
function shrinkLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
 const make=max=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png')};
 let out=make(480);if(out.length>350000)out=make(320);if(out.length>350000)out=make(220);res(out)};img.src=r.result};r.readAsDataURL(file)})}

  if(bad.length){const m=$('#umsg');m.innerHTML='Please check line'+(bad.length>1?'s ':' ')+bad.join(', ')+' — each line needs a name and a class or grade.';m.classList.add('show');return}
  items.forEach(it=>it.r.ext_ref='');matchItems(items);updReview()}}
function updReview(){const it=UPD;const used={};it.forEach(x=>{if(x.pick&&x.pick!=='NEW')used[x.pick]=(used[x.pick]||0)+1});
 const ok=it.filter(x=>x.pick&&x.pick!=='NEW').length,nw=it.filter(x=>x.pick==='NEW').length,choose=it.filter(x=>!x.pick&&x.cands.length).length,none=it.filter(x=>!x.cands.length&&x.pick!=='NEW').length;
 $('#modal').innerHTML=`<div class="modal"><div class="card" style="max-width:860px"><h2 style="font-size:22px">✏️ Check the matches</h2>
 <p class="small"><span class="pill done">${ok} to update</span> ${nw?`<span class="pill bum">${nw} new — will get codes</span>`:''} ${choose?`<span class="pill hon">${choose} to choose</span>`:''} ${none?`<span class="pill">${none} skipped</span>`:''}</p>
 <p class="small muted">Children already on the website keep their code and progress — only their surname, class and student number are filled in. Where two children share a first name, pick the right one (their code is on their printed card).</p>
 <div class="tablewrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th>From your list</th><th>Class</th><th>What will happen</th></tr></thead><tbody>
 ${it.map((x,i)=>`<tr${!x.pick?' style="opacity:.6"':''}><td><b>${esc(x.r.first_name)}</b> ${esc(x.r.last_name)}</td><td>${esc(x.r.class_name||GL(x.r.grade))}</td><td><select data-upk="${i}" style="min-width:280px${x.pick&&x.pick!=='NEW'&&used[x.pick]>1?';border-color:#DC2626':''}"><option value="">— skip —</option><option value="NEW" ${x.pick==='NEW'?'selected':''}>➕ Add as a new child (new code)</option>${x.cands.map(k=>`<option value="${k.id}" ${x.pick===k.id?'selected':''}>✏️ Update ${esc(fullName(k))} · ${fmtCode(k.code)}${k.class_name?' · '+esc(k.class_name):''}${x.sim?' (similar name)':''}</option>`).join('')}${(()=>{const o=KIDS.filter(k=>+k.grade===+x.r.grade&&!k.last_name&&!x.cands.includes(k)).sort((a,b)=>a.first_name.localeCompare(b.first_name));return o.length?`<optgroup label="Other ${GL(x.r.grade)} children without a surname">${o.map(k=>`<option value="${k.id}" ${x.pick===k.id?'selected':''}>✏️ Update ${esc(k.first_name)} · ${fmtCode(k.code)}</option>`).join('')}</optgroup>`:''})()}</select>${x.sim&&!x.pick?'<div class="small" style="color:#92400E">Similar name found — choose the right child</div>':''}${x.pick&&x.pick!=='NEW'&&used[x.pick]>1?'<div class="small" style="color:#DC2626">Chosen twice</div>':''}</td></tr>`).join('')}
 </tbody></table></div><div class="msg bad" id="umsg2"></div>
 <div class="row" style="margin-top:10px"><button class="w" id="uback">← Back</button><div class="spacer"></div><button class="w" id="uc">Cancel</button><button class="y" id="us" ${ok+nw?'':'disabled'}>💾 Save${ok?` ${ok} update${ok===1?'':'s'}`:''}${ok&&nw?' and':''}${nw?` add ${nw} new`:''}</button></div></div></div>`;
 $('#uc').onclick=()=>$('#modal').innerHTML='';$('#uback').onclick=()=>updModal(UPD.map(x=>x.line.replace(/ · /g,' ')).join('\n'));
 document.querySelectorAll('[data-upk]').forEach(sel=>sel.onchange=()=>{UPD[+sel.dataset.upk].pick=sel.value;updReview()});
 $('#us').onclick=async()=>{const dup=Object.values(used).some(n=>n>1);if(dup){const m=$('#umsg2');m.textContent='One child is chosen for two lines — please fix the red box first.';m.classList.add('show');return}
  const nws=UPD.filter(x=>x.pick==='NEW');if(nws.length&&SCHOOL&&SCHOOL.max_children&&KIDS.length+nws.length>SCHOOL.max_children){const m=$('#umsg2');m.innerHTML=`You can add ${Math.max(0,SCHOOL.max_children-KIDS.length)} more children on your plan. `+limitMsg();m.classList.add('show');bindLimit();return}
  const b=$('#us');b.disabled=true;b.textContent='Saving…';let done=0,fail=0,added=0;
  if(nws.length){const usedC=new Set(KIDS.map(k=>k.code));const rows=nws.map(x=>{let c;do{c=newCode()}while(usedC.has(c));usedC.add(c);const r={first_name:x.r.first_name,last_name:x.r.last_name,grade:x.r.grade,class_name:x.r.class_name||'',code:c};if(x.r.ext_ref)r.ext_ref=x.r.ext_ref;return r});
   let {data,error}=await sb.from('students').insert(rows).select();if(error&&/duplicate|unique/i.test(error.message||'')){rows.forEach(r=>r.code=newCode());({data,error}=await sb.from('students').insert(rows).select())}
   if(error){const m=$('#umsg2');m.textContent=/PLAN_LIMIT/.test(error.message||'')?'Your plan is full.':'Couldn’t add the new children. Please try again.';m.classList.add('show');b.disabled=false;b.textContent='💾 Try again';return}
   KIDS=KIDS.concat(data);data.forEach(d=>SEL.add(d.id));added=data.length;UPD.forEach(x=>{if(x.pick==='NEW')x.pick=''})}
  const jobs=UPD.filter(x=>x.pick).map(x=>async()=>{const row={first_name:x.r.first_name,last_name:x.r.last_name};if(x.r.class_name)row.class_name=x.r.class_name;if(x.r.ext_ref)row.ext_ref=x.r.ext_ref;
   const {error}=await sb.from('students').update(row).eq('id',x.pick);if(error){fail++;return}done++;const k=KIDS.find(k=>k.id===x.pick);if(k)Object.assign(k,row)});
  for(let i=0;i<jobs.length;i+=8)await Promise.all(jobs.slice(i,i+8).map(f=>f()));
  if(fail&&!done&&!added){const m=$('#umsg2');m.textContent='Couldn’t save. If this keeps happening, run setup-sb-lastname.sql in Supabase first.';m.classList.add('show');b.disabled=false;b.textContent='💾 Try again';return}
  $('#modal').innerHTML='';render();toast(`${done} updated${added?` · ${added} new added (ticked, ready to print their cards)`:''} ✓${fail?` · ${fail} couldn’t be saved`:''}`)}}
function goLimit(e){if(e&&e.preventDefault)e.preventDefault();$('#modal').innerHTML='';TAB='settings';render();setTimeout(()=>document.getElementById('plancard')?.scrollIntoView({behavior:'smooth'}),50)}
function bindLimit(){document.querySelectorAll('[data-golimit]').forEach(a=>a.onclick=goLimit)}
let CFIT=100;try{CFIT=+localStorage.getItem('sb-card-fit')||100}catch(e){}
const CSIZES=[{id:'l',name:'Large',cols:2,rows:2,k:1.4,note:'4 per page'},{id:'m',name:'Medium',cols:2,rows:3,k:.95,note:'6 per page'},{id:'s',name:'Small',cols:2,rows:4,k:.72,note:'8 per page'},{id:'x',name:'Mini',cols:3,rows:4,k:.58,note:'12 per page'}];
function printCards(){
 const list=SEL.size?KIDS.filter(c=>SEL.has(c.id)):visible();if(!list.length){toast('No children to print');return}
 let pick='m';try{pick=localStorage.getItem('sb-card-size')||'m'}catch(e){}if(!CSIZES.some(z=>z.id===pick))pick='m';
 const draw=()=>{$('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="font-size:21px">Print code cards</h2><p>${list.length} card${list.length===1?'':'s'}. Choose a size — every card stays whole on the page.</p><div class="csz">${CSIZES.map(z=>`<button data-csz="${z.id}" class="${z.id===pick?'on':''}">${z.name}<small>${z.note} · ${Math.ceil(list.length/(z.cols*z.rows))} page${Math.ceil(list.length/(z.cols*z.rows))===1?'':'s'}</small></button>`).join('')}</div><div style="margin:4px 0 10px"><label style="font-weight:800">Card size: <span id="cfv">${CFIT}%</span></label><input type="range" id="cfit" min="60" max="100" step="5" value="${CFIT}" style="width:100%"><div class="small muted">If any card still goes onto the next page, move this to the left to make the cards smaller.</div></div><p class="small muted">In the print window, keep Scaling at 100% and paper size A4.</p><div class="row"><div class="spacer"></div><button class="w" id="mc">Cancel</button><button class="y" id="mo">🖨 Print</button></div></div></div>`;
  document.querySelectorAll('[data-csz]').forEach(b=>b.onclick=()=>{pick=b.dataset.csz;draw()});
  $('#cfit').oninput=e=>{CFIT=+e.target.value;$('#cfv').textContent=CFIT+'%'};
  $('#mc').onclick=()=>$('#modal').innerHTML='';
  $('#mo').onclick=()=>{try{localStorage.setItem('sb-card-size',pick);localStorage.setItem('sb-card-fit',CFIT)}catch(e){}$('#modal').innerHTML='';buildCards(list,CSIZES.find(z=>z.id===pick))}};
 draw();
}
function buildCards(list,z){const per=z.cols*z.rows,pages=[];for(let i=0;i<list.length;i+=per)pages.push(list.slice(i,i+per));
 const card=c=>{const t=TEAMS[teamOf(c.grade)];return `<div class="ccard"><div class="bee">🐝</div><div class="h">Spelling Bee</div><div class="n">${esc(fullName(c))}</div><div class="tm">${t[1]} ${t[0]} · ${GL(c.grade)}${c.class_name?' · '+esc(c.class_name):''}</div><div class="lb">Your secret bee code</div><div class="cd">${fmtCode(c.code)}</div><div class="go">Go to <b>${SITE}</b>, click <b>Start practising</b> and type your code. Happy spelling! ✨</div></div>`};
 $('#cards').innerHTML=pages.map(pg=>`<div class="cpage" style="--f:${CFIT/100};--k:${(z.k*CFIT/100).toFixed(3)};grid-template-columns:repeat(${z.cols},minmax(0,1fr));grid-template-rows:repeat(${z.rows},minmax(0,1fr))">${pg.map(card).join('')}</div>`).join('');
 setTimeout(()=>window.print(),200);
}
function csv(){const list=visible();const rows=[['First name','Surname','Full name','Grade','Class','Student no.','Team','Code','Stars','Words learnt','Tricky words','Last practised']].concat(list.map(c=>[c.first_name,c.last_name||'',fullName(c),GL(c.grade),c.class_name||'',c.ext_ref||'',TEAMS[teamOf(c.grade)][0],fmtCode(c.code),PROG[c.id]?.stars||0,learnt(c.id),tricky(c.id).join(' '),PROG[c.id]?.last_seen?new Date(PROG[c.id].last_seen).toLocaleString('en-GB'):'']));
 const txt=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));a.download='spelling-bee-spellers.csv';a.click()}
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
start();
})();
</script>
