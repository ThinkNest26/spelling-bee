<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Spelling Bee – Teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{--aa:#1B3A6B;--aa2:#D62839;--honey:#F5B700;--honey2:#FFD54A;--honeyL:#FFF3C4;--ink:#1F2A44;--ink2:#46506B;--muted:#6B7280;--bg:#FFFBEF;--line:#EFE6CC;--ok:#1E9E5A;--okL:#E3F6EA;--bad:#D64545;--badL:#FDE8E8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font-family:inherit;font-weight:800;font-size:14px;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--aa);color:#fff}
button.y{background:var(--honey);color:var(--ink)}button.w{background:#fff;color:var(--ink);border:1.5px solid var(--line)}button.r{background:var(--bad)}
button.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--honey2);border-color:var(--honey)}
label{font-size:12.5px;font-weight:800;color:var(--ink2);display:block;margin-bottom:4px}
header{background:var(--aa);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header .t{font-family:Fredoka;font-size:21px}header .s{font-size:12.5px;opacity:.75}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
header button{background:rgba(255,255,255,.15)}
main{max-width:1200px;margin:0 auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{font-family:Fredoka;font-size:32px;line-height:1}.muted{color:var(--muted)}.small{font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer}

td input,td select{padding:5px 7px}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.buz{background:#FCE7F3;color:#9D174D}.hon{background:#FEF3C7;color:#92400E}.bum{background:#DBEAFE;color:#1E40AF}.cha{background:#EDE9FE;color:#5B21B6}
.bar{height:8px;background:#F3EBD2;border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--honey)}
.tricky{font-size:12.5px;color:#991B1B}
.login{max-width:420px;margin:60px auto}
.msg{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:700}.msg.show{display:block}.msg.bad{background:var(--badL);color:#991B1B}.msg.ok{background:var(--okL);color:#166534}

.modal .card{max-width:580px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;z-index:60;display:none}
.tablewrap{overflow-x:auto}
/* printable code cards */
.invgrid{display:grid;grid-template-columns:230px minmax(280px,1fr) minmax(300px,1.1fr);gap:14px;align-items:start}
@media (max-width:1050px){.invgrid{grid-template-columns:1fr}}
.invitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-bottom:6px}
.invitem.on{border-color:var(--honey);background:var(--honeyL)}
.invform textarea{resize:vertical}
.logobox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:10px}.logobox img{max-height:56px;max-width:160px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;margin:0;font-weight:800;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px}
.swatch{width:42px;height:42px;border-radius:50%;border:5px solid;padding:0}.swatch.on{outline:3px solid var(--ink);outline-offset:2px}
.btnlink{display:inline-block;padding:9px 14px;border-radius:10px;font-weight:800;text-decoration:none;font-size:14px;background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:15px;padding:10px 16px}.tabs button.on{background:var(--aa);color:#fff;border-color:var(--aa)}
.teams button{background:#fff;color:var(--ink);border:2px solid var(--line)}.teams button.on{border-color:var(--honey);background:var(--honeyL)}
.pill.need{background:#FEF3C7;color:#92400E}.pill.done{background:var(--okL);color:#166534}
.card.warn{background:#FFF7E0;border-color:#F5D58A}.card.okc{background:var(--okL);border-color:#A7E3BF;font-weight:800}
code{background:#F3EBD2;padding:1px 6px;border-radius:6px;font-size:13px}
#cards{display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10mm;padding:8mm}
.ccard{border:3px dashed #F5B700;border-radius:16px;padding:14px;text-align:center;break-inside:avoid;page-break-inside:avoid;background:#fff}
.ccard .bee{font-size:40px}.ccard .h{font-family:Fredoka;font-size:22px;color:#1B3A6B}.ccard .n{font-family:Fredoka;font-size:28px;margin-top:4px}
.ccard .tm{font-weight:800;color:#46506B}.ccard .cd{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:800;letter-spacing:.12em;background:#FFF3C4;border-radius:12px;padding:8px;margin:10px 0}
.ccard .go{font-size:14px}
@media print{body:not(.inv-printing)>*:not(#cards){display:none!important}body:not(.inv-printing) #cards{display:block!important}body:not(.inv-printing){}@page{size:A4;margin:8mm}}
</style>
</head>

let TAB='spellers',WROWS=[],HAVE=new Set(),WTEAM='buz',sb=null,USER=null,KIDS=[],PROG={},F={grade:'all',cls:'all',q:''},SORT={k:'grade',d:1},SEL=new Set();

/* resize a logo so it is small enough to save (max 480px, keeps transparency) */
function shrinkLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
 const make=max=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png')};

function renderWords(){
 const rows=WROWS.filter(w=>w.team===WTEAM),missing=WROWS.filter(w=>needs(w).length).length;
 $('#app').innerHTML=tabs()+`
 ${missing?`<div class="card warn"><b>🎙 ${missing} word${missing>1?'s':''} need${missing>1?'':'s'} Kate’s voice recorded.</b> Until then, children hear their device’s own voice for ${missing>1?'these':'this one'}. To record: on the Mac, open Terminal, type <code>cd ~/Documents/GitHub/spelling-bee</code> then <code>bash make-audio.sh</code>, then commit and Push origin in GitHub Desktop.</div>`:`<div class="card okc">✅ Every word has Kate’s recording.</div>`}
 <div class="card" style="margin-top:14px"><div class="row"><h2 style="font-size:20px">Word lists</h2><div class="spacer"></div><button class="y" id="addw">+ Add words</button></div>
 <div class="row teams" style="margin-top:12px">${Object.entries(TEAMS).map(([t,v])=>`<button class="${WTEAM===t?'on':''} ${t}" data-wteam="${t}">${v[1]} ${v[0]} <span class="muted">(${WROWS.filter(w=>w.team===t).length})</span></button>`).join('')}</div>
 <p class="small muted">${{buz:'KG2 · Year 1',hon:'Grade 1 · Year 2',bum:'Grades 2–3 · Years 3–4',cha:'Grades 4–5 · Years 5–6'}[WTEAM]}. Changes appear on the children’s practice pages straight away (they may need to refresh). Sentences are used in <b>📝 Fill the gap</b> and must include the word. A word without a sentence is left out of Fill the gap.</p>
 <div class="tablewrap"><table><thead><tr><th style="width:40px">#</th><th>Word</th><th>Example sentence (for Fill the gap)</th><th>Kate’s voice</th><th></th></tr></thead><tbody>
 ${rows.map((w,i)=>{const n=needs(w);return `<tr><td class="muted small">${i+1}</td>
  <td><input value="${esc(w.word)}" data-wid="${w.id}" data-wf="word" style="font-weight:800;min-width:140px"></td>
  <td><input value="${esc(w.sentence)}" data-wid="${w.id}" data-wf="sentence" placeholder="—" style="min-width:260px"></td>
  <td class="small">${n.length?'<span class="pill need">🎙 needs recording</span>':'<span class="pill done">✅ recorded</span>'}</td>
  <td><button class="w sm" data-wdel="${w.id}" title="Remove">✕</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted" style="padding:20px">No words in this list yet.</td></tr>'}
 </tbody></table></div></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
 document.querySelectorAll('[data-wteam]').forEach(b=>b.onclick=()=>{WTEAM=b.dataset.wteam;render()});
 $('#addw').onclick=addWordsModal;
 document.querySelectorAll('[data-wid]').forEach(x=>x.onchange=async()=>{const id=+x.dataset.wid,f=x.dataset.wf,v=x.value.trim().replace(/\s+/g,' ');const w=WROWS.find(r=>r.id===id);
  if(f==='word'&&!/^[\p{L}'’-]{1,40}$/u.test(v)){toast('A word can only have letters (no spaces).');x.value=w.word;return}
  if(f==='sentence'&&v&&!hasWord(w.word,v)){toast('The sentence must include the word “'+w.word+'” (for Fill the gap).');x.value=w.sentence;return}
  if(f==='word'&&w.sentence&&!hasWord(v,w.sentence)){toast('Remember to update the sentence so it includes “'+v+'”.')}
  if(f==='word'&&WROWS.some(r=>r.team===w.team&&r.id!==id&&r.word.toLowerCase()===v.toLowerCase())){toast('That word is already in this list.');x.value=w.word;return}
  const {error}=await sb.from('words').update({[f]:v}).eq('id',id);if(error){toast('Couldn’t save that change');x.value=w[f];return}
  await loadWords();render();toast('Saved ✓')});
 document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{const w=WROWS.find(r=>r.id===+b.dataset.wdel);confirmBox('Remove “'+w.word+'”?','It will disappear from the '+TEAMS[w.team][0]+' list. Children’s progress on other words is not affected.','Remove',async()=>{const {error}=await sb.from('words').delete().eq('id',w.id);if(error){toast('Couldn’t remove');return}await loadWords();render();toast('Removed')},true)});
}
function addWordsModal(){
 $('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="font-size:22px">Add words to ${TEAMS[WTEAM][1]} ${TEAMS[WTEAM][0]}</h2>
 <p class="small muted">One word per line. To add an example sentence, put a <b>|</b> after the word:<br><code>adventure</code><br><code>knight | The knight rode a white horse.</code></p>
 <textarea id="nw" rows="10"></textarea><div class="msg bad" id="wmsg"></div>
 <div class="row" style="margin-top:10px"><div class="spacer"></div><button class="w" id="wc">Cancel</button><button class="y" id="wo">Add words</button></div></div></div>`;
 $('#wc').onclick=()=>$('#modal').innerHTML='';
 $('#wo').onclick=async()=>{const have=new Set(WROWS.filter(r=>r.team===WTEAM).map(r=>r.word.toLowerCase()));let pos=WROWS.filter(r=>r.team===WTEAM).length;const add=[],bad=[],dup=[];
  $('#nw').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [w0,...rest]=l.split('|');const word=w0.trim().replace(/[.,;:!?]+$/,'');const sentence=rest.join('|').trim();
   if(!/^[\p{L}'’-]{1,40}$/u.test(word)||(sentence&&!hasWord(word,sentence))){bad.push(i+1);return}if(have.has(word.toLowerCase())){dup.push(word);return}have.add(word.toLowerCase());add.push({team:WTEAM,word,sentence,position:++pos})});
  if(bad.length){const m=$('#wmsg');m.innerHTML='Please check line'+(bad.length>1?'s ':' ')+bad.join(', ')+' — one word per line (letters only), with an optional <b>| sentence</b> that includes the word.';m.classList.add('show');return}
  if(!add.length){$('#modal').innerHTML='';toast(dup.length?'Those words are already in the list':'Nothing to add');return}
  const b=$('#wo');b.disabled=true;b.textContent='Adding…';const {error}=await sb.from('words').insert(add);
  if(error){b.disabled=false;b.textContent='Add words';const m=$('#wmsg');m.textContent='Couldn’t add the words. Please try again.';m.classList.add('show');return}
  $('#modal').innerHTML='';await loadWords();render();toast(add.length+' word'+(add.length>1?'s':'')+' added'+(dup.length?' ('+dup.length+' already there)':'')+' — remember to record Kate’s voice')};
}
function learnt(id){const p=PROG[id];if(!p)return 0;return Object.values(p.words||{}).filter(n=>n>=2).length}
function tricky(id){const p=PROG[id];if(!p)return [];return Object.entries(p.tricky||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}
function visible(){const q=F.q.toLowerCase();return KIDS.filter(c=>(F.grade==='all'||c.grade==F.grade)&&(F.cls==='all'||c.class_name===F.cls)&&(!q||c.first_name.toLowerCase().includes(q)||c.code.toLowerCase().includes(q.replace(/-/g,''))))
 .sort((a,b)=>{const k=SORT.k,d=SORT.d;const v=c=>k==='stars'?(PROG[c.id]?.stars||0):k==='learnt'?learnt(c.id):k==='seen'?(PROG[c.id]?.last_seen||''):k==='grade'?c.grade*1000+(c.class_name||'').charCodeAt(0):String(c[k]||'').toLowerCase();const x=v(a),y=v(b);return (x>y?1:x<y?-1:0)*d||a.first_name.localeCompare(b.first_name)})}
function render(){
 if(TAB==='words'){renderWords();return}
 if(TAB==='invites'){renderInvites();return}
 const list=visible();const classes=[...new Set(KIDS.filter(c=>F.grade==='all'||c.grade==F.grade).map(c=>c.class_name).filter(Boolean))].sort();
 const active=KIDS.filter(c=>PROG[c.id]?.last_seen&&(Date.now()-new Date(PROG[c.id].last_seen))<7*864e5).length;
 const stars=KIDS.reduce((n,c)=>n+(PROG[c.id]?.stars||0),0);
 $('#app').innerHTML=tabs()+`<div class="grid g4" style="margin-bottom:16px">
  <div class="card"><div class="stat">${KIDS.length}</div><div class="small muted">spellers with codes</div></div>
  <div class="card"><div class="stat">${active}</div><div class="small muted">practised this week</div></div>
  <div class="card"><div class="stat">${stars}</div><div class="small muted">stars earned in total</div></div>
  <div class="card"><div class="stat">${KIDS.filter(c=>!PROG[c.id]?.last_seen).length}</div><div class="small muted">haven’t started yet</div></div></div>
 <div class="card"><div class="row"><h2 style="font-size:20px">Spellers</h2><div class="spacer"></div>
  <button class="y" id="add">+ Add children</button><button class="w" id="print">🖨 Print code cards${SEL.size?' ('+SEL.size+')':''}</button><button class="w" id="csv">⬇ Download list</button><button class="w" id="refresh">↻ Refresh</button></div>
  <div class="row" style="margin-top:12px">
   <select id="fg" style="max-width:160px"><option value="all">All grades</option>${GRADES.map(g=>`<option value="${g}" ${F.grade==g?'selected':''}>${GL(g)}</option>`).join('')}</select>
   <select id="fc" style="max-width:160px"><option value="all">All classes</option>${classes.map(c=>`<option ${F.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <input id="fq" placeholder="Search name or code…" style="max-width:240px" value="${esc(F.q)}">
   <span class="small muted">${list.length} shown</span></div>
  <div class="tablewrap" style="margin-top:10px"><table><thead><tr>
   <th><input type="checkbox" id="all" style="width:auto" ${list.length&&list.every(c=>SEL.has(c.id))?'checked':''}></th>
   <th data-s="first_name">Name</th><th data-s="grade">Grade · class</th><th>Code</th><th data-s="stars">⭐ Stars</th><th data-s="learnt">Words learnt</th><th>Tricky words</th><th data-s="seen">Last practised</th><th></th></tr></thead><tbody>
   ${list.map(c=>{const t=teamOf(c.grade),p=PROG[c.id]||{},L=learnt(c.id),tot=TEAMS[t][2];return `<tr>
    <td><input type="checkbox" data-sel="${c.id}" style="width:auto" ${SEL.has(c.id)?'checked':''}></td>
    <td><input value="${esc(c.first_name)}" data-ed="${c.id}" data-f="first_name" style="min-width:120px;font-weight:800"></td>
    <td><div class="row" style="gap:6px;flex-wrap:nowrap"><select data-ed="${c.id}" data-f="grade" style="width:84px">${GRADES.map(g=>`<option value="${g}" ${c.grade==g?'selected':''}>${g===0?'KG2':g}</option>`).join('')}</select><input value="${esc(c.class_name)}" data-ed="${c.id}" data-f="class_name" style="width:70px"><span class="pill ${t}" title="${TEAMS[t][0]}">${TEAMS[t][1]}</span></div></td>
    <td><span class="code">${fmtCode(c.code)}</span></td>
    <td><b>${p.stars||0}</b></td>
    <td><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="bar"><i style="width:${Math.min(100,Math.round(L/tot*100))}%"></i></div><span class="small">${L}/${tot}</span></div></td>
    <td class="tricky">${tricky(c.id).map(esc).join(', ')||'<span class="muted">—</span>'}</td>
    <td class="small">${ago(p.last_seen)}</td>
    <td style="white-space:nowrap"><button class="w sm" data-recode="${c.id}" title="Give a new code">New code</button> <button class="w sm" data-del="${c.id}" title="Remove">✕</button></td></tr>`}).join('')||`<tr><td colspan="9" class="muted" style="padding:22px">No spellers yet. Click <b>+ Add children</b> and paste names from your class list.</td></tr>`}
  </tbody></table></div>
  <p class="small muted" style="margin-bottom:0">A word counts as <b>learnt</b> once the child has spelt it correctly twice. Tick children to print just their cards; with none ticked, the cards for everyone shown are printed.</p></div>`;
 bind();
}
function bind(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});
 $('#add').onclick=addModal;$('#print').onclick=printCards;$('#csv').onclick=csv;$('#refresh').onclick=load;
 $('#fg').onchange=e=>{F.grade=e.target.value;F.cls='all';render()};$('#fc').onchange=e=>{F.cls=e.target.value;render()};
 $('#fq').oninput=e=>{F.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#fq');i.focus();i.setSelectionRange(pos,pos)};
 $('#all').onchange=e=>{visible().forEach(c=>e.target.checked?SEL.add(c.id):SEL.delete(c.id));render()};
 document.querySelectorAll('[data-sel]').forEach(x=>x.onchange=()=>{x.checked?SEL.add(x.dataset.sel):SEL.delete(x.dataset.sel);$('#print').textContent='🖨 Print code cards'+(SEL.size?' ('+SEL.size+')':'')});
 document.querySelectorAll('th[data-s]').forEach(x=>x.onclick=()=>{const k=x.dataset.s;SORT.d=SORT.k===k?-SORT.d:1;SORT.k=k;render()});
 document.querySelectorAll('[data-ed]').forEach(x=>x.onchange=async()=>{const id=x.dataset.ed,f=x.dataset.f;let v=x.value.trim();if(f==='grade')v=+v;if(f==='first_name'&&!v){render();return}
  const {error}=await sb.from('students').update({[f]:v}).eq('id',id);if(error){toast('Couldn’t save that change');return}const c=KIDS.find(k=>k.id===id);c[f]=v;toast('Saved ✓');if(f==='grade')render()});
 document.querySelectorAll('[data-recode]').forEach(x=>x.onclick=()=>confirmBox('Give a new code?','The old code will stop working. Progress is kept.','New code',async()=>{const id=x.dataset.recode;for(let i=0;i<5;i++){const code=newCode();const {error}=await sb.from('students').update({code}).eq('id',id);if(!error){KIDS.find(k=>k.id===id).code=code;render();toast('New code: '+fmtCode(code));return}}toast('Couldn’t make a new code')}));
 document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{const c=KIDS.find(k=>k.id===x.dataset.del);confirmBox('Remove '+c.first_name+'?','Their code and all their progress will be deleted.','Remove',async()=>{const {error}=await sb.from('students').delete().eq('id',c.id);if(error){toast('Couldn’t remove');return}KIDS=KIDS.filter(k=>k.id!==c.id);SEL.delete(c.id);render();toast('Removed')},true)});
}
function confirmBox(title,text,btn,fn,danger){$('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="font-size:21px">${esc(title)}</h2><p>${esc(text)}</p><div class="row"><div class="spacer"></div><button class="w" id="mc">Cancel</button><button class="${danger?'r':'y'}" id="mo">${esc(btn)}</button></div></div></div>`;
 $('#mc').onclick=()=>$('#modal').innerHTML='';$('#mo').onclick=async()=>{$('#modal').innerHTML='';await fn()}}
/* understands: "Mariam, 1, 1A" · "dina 1A" · "mona KG2" · "Saeed Ahmed KG2B" · "Lina Grade 5 5C" */
function parseLine(line){const toks=line.split(/[,\t;]+|\s+/).map(t=>t.trim()).filter(Boolean);if(!toks.length)return null;
 let name=null,grade=null,cls='';
 for(const t of toks){const u=t.toUpperCase().replace(/[.\-_/]/g,'');
  if(/^(GRADE|GR|YEAR|CLASS)$/.test(u))continue;
  let m;
  if((m=u.match(/^KG2?([A-Z]{0,2})$/))){grade=0;if(m[1])cls='KG2'+m[1];continue}
  if((m=u.match(/^(?:G|GR|GRADE)?([0-5])([A-Z]{0,2})$/))){const g=+m[1];if(m[2]){cls=m[1]+m[2];if(grade===null)grade=g}else if(grade===null)grade=g;continue}
  if(name===null&&/^[\p{L}'’]+$/u.test(t)){name=t;continue}
  if(name!==null&&/^[A-Z]$/.test(u)&&grade!==null&&!cls){cls=(grade===0?'KG2':grade)+u;continue}}
 if(grade===null&&F.grade!=='all')grade=+F.grade;
 if(!name||grade===null||grade<0||grade>5)return null;
 name=name.charAt(0).toLocaleUpperCase()+name.slice(1);
 return {first_name:name,grade,class_name:cls}}
function addModal(){
 $('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="font-size:22px">Add children</h2>
 <p class="small muted">One child per line: their <b>first name</b> and <b>class</b> (or grade). Paste straight from a class list — commas are optional.<br><code>Mariam 1A</code> &nbsp; <code>Saeed KG2B</code> &nbsp; <code>Lina, 5, 5C</code> &nbsp; <code>Omar KG2</code>${F.grade!=='all'?`<br>Lines with no grade go into <b>${GL(F.grade)}</b> (the grade you’re viewing).`:''}</p>
 <textarea id="kids" rows="10" placeholder="Mariam, 1, 1A"></textarea>
 <div class="msg bad" id="amsg"></div>
 <div class="row" style="margin-top:10px"><div class="spacer"></div><button class="w" id="ac">Cancel</button><button class="y" id="ao">Add and make codes</button></div></div></div>`;
 $('#ac').onclick=()=>$('#modal').innerHTML='';
 $('#ao').onclick=async()=>{const rows=[],bad=[];
  $('#kids').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const r=parseLine(l);if(!r){bad.push(i+1);return}rows.push(r)});
  if(bad.length){const m=$('#amsg');m.innerHTML='Please check line'+(bad.length>1?'s ':' ')+bad.join(', ')+' — each line needs a first name and a class or grade, e.g. <b>Mariam 1A</b> or <b>Saeed KG2</b>.';m.classList.add('show');return}
  if(!rows.length)return;const b=$('#ao');b.disabled=true;b.textContent='Making codes…';
  const used=new Set(KIDS.map(k=>k.code));rows.forEach(r=>{let c;do{c=newCode()}while(used.has(c));used.add(c);r.code=c});
  let {data,error}=await sb.from('students').insert(rows).select();
  if(error&&/duplicate|unique/i.test(error.message)){rows.forEach(r=>r.code=newCode());({data,error}=await sb.from('students').insert(rows).select())}
  if(error){b.disabled=false;b.textContent='Add and make codes';const m=$('#amsg');m.textContent='Couldn’t add the children. Please try again.';m.classList.add('show');return}
  $('#modal').innerHTML='';KIDS=KIDS.concat(data);data.forEach(d=>SEL.add(d.id));render();toast(data.length+' children added — their cards are ticked, ready to print')};
}
function printCards(){
 const list=SEL.size?KIDS.filter(c=>SEL.has(c.id)):visible();if(!list.length){toast('No children to print');return}
 $('#cards').innerHTML=`<div class="cards">${list.map(c=>{const t=TEAMS[teamOf(c.grade)];return `<div class="ccard"><div class="bee">🐝</div><div class="h">Spelling Bee</div><div class="n">${esc(c.first_name)}</div><div class="tm">${t[1]} ${t[0]} · ${GL(c.grade)}${c.class_name?' · '+esc(c.class_name):''}</div><div class="small" style="margin-top:8px">Your secret bee code</div><div class="cd">${fmtCode(c.code)}</div><div class="go">Go to <b>${SITE}</b>, click <b>Start practising</b> and type your code. Happy spelling! ✨</div></div>`}).join('')}</div>`;
 setTimeout(()=>window.print(),150);
}
function csv(){const list=visible();const rows=[['First name','Grade','Class','Team','Code','Stars','Words learnt','Tricky words','Last practised']].concat(list.map(c=>[c.first_name,GL(c.grade),c.class_name,TEAMS[teamOf(c.grade)][0],fmtCode(c.code),PROG[c.id]?.stars||0,learnt(c.id),tricky(c.id).join(' '),PROG[c.id]?.last_seen?new Date(PROG[c.id].last_seen).toLocaleString('en-GB'):'']));
 const txt=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));a.download='spelling-bee-spellers.csv';a.click()}
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
start();
})();
</script>
