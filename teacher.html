/* resize a logo so it is small enough to save (max 480px, keeps transparency) */
function shrinkLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
 const make=max=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png')};
 let out=make(480);if(out.length>350000)out=make(320);if(out.length>350000)out=make(220);res(out)};img.src=r.result};r.readAsDataURL(file)})}

/* understands: "Mariam, 1, 1A" · "dina 1A" · "mona KG2" · "Saeed Ahmed KG2B" · "Lina Grade 5 5C" */
function parseLine(line){const toks=line.split(/[,\t;]+|\s+/).map(t=>t.trim()).filter(Boolean);if(!toks.length)return null;
 let name=null,grade=null,cls='';
 for(const t of toks){const u=t.toUpperCase().replace(/[.\-_/]/g,'');
  if(/^(GRADE|GR|YEAR|CLASS)$/.test(u))continue;
  let m;
  if((m=u.match(/^KG2?([A-Z]{0,2})$/))){grade=0;if(m[1])cls='KG2'+m[1];continue}
  if((m=u.match(/^(?:G|GR|GRADE)?([0-5])([A-Z]{0,2})$/))){const g=+m[1];if(m[2]){cls=m[1]+m[2];if(grade===null)grade=g}else if(grade===null)grade=g;continue}
  if(name===null&&/^[\p{L}'’]+$/u.test(t)){name=t;continue}
  if(name!==null&&/^[A-Z]$/.test(u)&&grade!==null&&!cls){cls=(grade===0?'KG2':grade)+u;continue}}
 if(grade===null&&F.grade!=='all')grade=+F.grade;
 if(!name||grade===null||grade<0||grade>5)return null;
 name=name.charAt(0).toLocaleUpperCase()+name.slice(1);
 return {first_name:name,grade,class_name:cls}}

 <div class="msg bad" id="amsg"></div>
 <div class="row" style="margin-top:10px"><div class="spacer"></div><button class="w" id="ac">Cancel</button><button class="y" id="ao">Add and make codes</button></div></div></div>`;
 $('#ac').onclick=()=>$('#modal').innerHTML='';
 $('#ao').onclick=async()=>{const rows=[],bad=[];
  $('#kids').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const r=parseLine(l);if(!r){bad.push(i+1);return}rows.push(r)});
  if(bad.length){const m=$('#amsg');m.innerHTML='Please check line'+(bad.length>1?'s ':' ')+bad.join(', ')+' — each line needs a first name and a class or grade, e.g. <b>Mariam 1A</b> or <b>Saeed KG2</b>.';m.classList.add('show');return}
  if(!rows.length)return;if(SCHOOL&&SCHOOL.max_children&&KIDS.length+rows.length>SCHOOL.max_children){const m=$('#amsg');const left=Math.max(0,SCHOOL.max_children-KIDS.length);m.innerHTML=`You can add <b>${left}</b> more child${left===1?'':'ren'} (you pasted ${rows.length}). `+limitMsg();m.classList.add('show');bindLimit();return}const b=$('#ao');b.disabled=true;b.textContent='Making codes…';
  const used=new Set(KIDS.map(k=>k.code));rows.forEach(r=>{let c;do{c=newCode()}while(used.has(c));used.add(c);r.code=c});
  let {data,error}=await sb.from('students').insert(rows).select();
  if(error&&/duplicate|unique/i.test(error.message)){rows.forEach(r=>r.code=newCode());({data,error}=await sb.from('students').insert(rows).select())}
  if(error){b.disabled=false;b.textContent='Add and make codes';const m=$('#amsg');if(/PLAN_LIMIT/.test(error.message)){m.innerHTML=limitMsg();bindLimit()}else m.textContent='Couldn’t add the children. Please try again.';m.classList.add('show');return}
  $('#modal').innerHTML='';KIDS=KIDS.concat(data);data.forEach(d=>SEL.add(d.id));render();toast(data.length+' children added — their cards are ticked, ready to print')};
}
function goLimit(e){if(e&&e.preventDefault)e.preventDefault();$('#modal').innerHTML='';TAB='settings';render();setTimeout(()=>document.getElementById('plancard')?.scrollIntoView({behavior:'smooth'}),50)}
function bindLimit(){document.querySelectorAll('[data-golimit]').forEach(a=>a.onclick=goLimit)}
const CSIZES=[{id:'l',name:'Large',cols:2,rows:2,k:1.5,note:'4 per page'},{id:'m',name:'Medium',cols:2,rows:3,k:1.02,note:'6 per page'},{id:'s',name:'Small',cols:2,rows:4,k:.78,note:'8 per page'},{id:'x',name:'Mini',cols:3,rows:4,k:.62,note:'12 per page'}];
function printCards(){
 const list=SEL.size?KIDS.filter(c=>SEL.has(c.id)):visible();if(!list.length){toast('No children to print');return}
 let pick='m';try{pick=localStorage.getItem('sb-card-size')||'m'}catch(e){}if(!CSIZES.some(z=>z.id===pick))pick='m';
 const draw=()=>{$('#modal').innerHTML=`<div class="modal"><div class="card"><h2 style="font-size:21px">Print code cards</h2><p>${list.length} card${list.length===1?'':'s'}. Choose a size — every card stays whole on the page.</p><div class="csz">${CSIZES.map(z=>`<button data-csz="${z.id}" class="${z.id===pick?'on':''}">${z.name}<small>${z.note} · ${Math.ceil(list.length/(z.cols*z.rows))} page${Math.ceil(list.length/(z.cols*z.rows))===1?'':'s'}</small></button>`).join('')}</div><p class="small muted">In the print window, keep Scaling at 100% and paper size A4.</p><div class="row"><div class="spacer"></div><button class="w" id="mc">Cancel</button><button class="y" id="mo">🖨 Print</button></div></div></div>`;
  document.querySelectorAll('[data-csz]').forEach(b=>b.onclick=()=>{pick=b.dataset.csz;draw()});
  $('#mc').onclick=()=>$('#modal').innerHTML='';
  $('#mo').onclick=()=>{try{localStorage.setItem('sb-card-size',pick)}catch(e){}$('#modal').innerHTML='';buildCards(list,CSIZES.find(z=>z.id===pick))}};
 draw();
}
function buildCards(list,z){const per=z.cols*z.rows,pages=[];for(let i=0;i<list.length;i+=per)pages.push(list.slice(i,i+per));
 const card=c=>{const t=TEAMS[teamOf(c.grade)];return `<div class="ccard"><div class="bee">🐝</div><div class="h">Spelling Bee</div><div class="n">${esc(c.first_name)}</div><div class="tm">${t[1]} ${t[0]} · ${GL(c.grade)}${c.class_name?' · '+esc(c.class_name):''}</div><div class="lb">Your secret bee code</div><div class="cd">${fmtCode(c.code)}</div><div class="go">Go to <b>${SITE}</b>, click <b>Start practising</b> and type your code. Happy spelling! ✨</div></div>`};
 $('#cards').innerHTML=pages.map(pg=>`<div class="cpage" style="--k:${z.k};grid-template-columns:repeat(${z.cols},minmax(0,1fr));grid-template-rows:repeat(${z.rows},minmax(0,1fr))">${pg.map(card).join('')}</div>`).join('');
 setTimeout(()=>window.print(),200);
}
function csv(){const list=visible();const rows=[['First name','Grade','Class','Team','Code','Stars','Words learnt','Tricky words','Last practised']].concat(list.map(c=>[c.first_name,GL(c.grade),c.class_name,TEAMS[teamOf(c.grade)][0],fmtCode(c.code),PROG[c.id]?.stars||0,learnt(c.id),tricky(c.id).join(' '),PROG[c.id]?.last_seen?new Date(PROG[c.id].last_seen).toLocaleString('en-GB'):'']));
 const txt=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));a.download='spelling-bee-spellers.csv';a.click()}
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
start();
})();
</script>
</body>
</html>
